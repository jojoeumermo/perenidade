#
# O app da Alumia para computador (Windows, macOS, Linux), onda R3, itens 1.2 e 2.4. Tauri 2: uma janela com a casca do chat
# EMPACOTADA (a mesma do Android, casca/saida), nenhuma página remota, lista de comandos fechada (build.rs + capabilities/). O núcleo
# nativo (cofre e conferência no Rekor) é o crate ../../nativo/nucleo. Roteiro de build reproduzível: docs/BUILD-REPRODUZIVEL.md.
[package]
name = "alumia-computador"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "alumia_computador"
crate-type = ["rlib"]

[[bin]]
name = "alumia"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
alumia-nucleo = { path = "../../nativo/nucleo" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.2"
# Só HTTPS, pela pilha TLS em Rust (rustls) com os certificados do sistema; sem cookie, sem proxy do sistema.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "blocking"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
url = "=2.5.9"
base64 = "=0.22.1"

[dev-dependencies]
proptest = "=1.12.0"
