# Léxico de pronúncia das vozes naturais do "Ouvir a aula" (Kokoro e Piper, que leem pelo espeak-ng em pt-br).
# Cada entrada diz como a voz deve LER a palavra: a escrita da direita é a que soa certo, não a correta no papel.
# Só vale para as vozes naturais; a voz do aparelho lê o texto como está.
#
# siglas: exatas, em maiúsculas. Sigla sem entrada aqui é lida como palavra quando dá (ONU, PIB, SUS) e letra por letra
#         quando não dá (STF, IBGE). Ponha aqui só as que a regra erra.
# palavras: sem diferença de maiúsculas, palavra inteira. Estrangeirismos, nomes próprios, autores e obras.
#
# Testado por `npm run testar:vozes` (forma do arquivo e alguns exemplos). Cresce a cada aula ouvida com erro.

