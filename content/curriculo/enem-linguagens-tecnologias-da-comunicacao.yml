# Mapa curricular da trilha enem-linguagens-tecnologias-da-comunicacao: cada aula escrita ligada às habilidades da
# Matriz do Enem e aos tópicos de content/enem/matriz.yml. Formato: docs/ENEM.md, seção 5. Tudo a-confirmar até um
# educador conferir.
fontes:
  - 'Matriz de Referência do Enem, Inep: https://download.inep.gov.br/download/enem/matriz_referencia.pdf'
aulas:
  internet-hipertexto-e-redes-sociais:
    enem:
      - area: linguagens
        competencia: 9
        habilidade: 28
        resumo: Reconhecer a função e o impacto social das tecnologias da comunicação e da informação.
        situacao: a-confirmar
      - area: linguagens
        competencia: 1
        habilidade: 3
        resumo: Relacionar as informações dos meios de comunicação à função social que eles têm.
        situacao: a-confirmar
      - area: linguagens
        competencia: 1
        habilidade: 1
        resumo: Reconhecer as diferentes linguagens e os recursos expressivos de cada meio de comunicação.
        situacao: a-confirmar
    objetos: [lin-generos-digitais-hipertexto]
  algoritmos-e-bolhas:
    enem:
      - area: linguagens
        competencia: 9
        habilidade: 28
        resumo: Reconhecer a função e o impacto social das tecnologias da comunicação e da informação.
        situacao: a-confirmar
      - area: linguagens
        competencia: 1
        habilidade: 4
        resumo: Reconhecer críticas aos usos sociais das linguagens e dos meios de comunicação.
        situacao: a-confirmar
      - area: linguagens
        competencia: 9
        habilidade: 30
        resumo: Relacionar as tecnologias da comunicação ao desenvolvimento das sociedades e ao conhecimento que elas produzem.
        situacao: a-confirmar
    objetos: [lin-generos-digitais-algoritmos]
  desinformacao-e-checagem:
    enem:
      - area: linguagens
        competencia: 9
        habilidade: 28
        resumo: Reconhecer a função e o impacto social das tecnologias da comunicação e da informação.
        situacao: a-confirmar
      - area: linguagens
        competencia: 9
        habilidade: 30
        resumo: Relacionar as tecnologias da comunicação ao desenvolvimento das sociedades e ao conhecimento que elas produzem.
        situacao: a-confirmar
      - area: linguagens
        competencia: 7
        habilidade: 24
        resumo: Reconhecer estratégias para convencer o público, como intimidação, sedução, comoção ou chantagem.
        situacao: a-confirmar
    objetos: [lin-generos-digitais-desinformacao]
  privacidade-e-dados:
    enem:
      - area: linguagens
        competencia: 9
        habilidade: 28
        resumo: Reconhecer a função e o impacto social das tecnologias da comunicação e da informação.
        situacao: a-confirmar
      - area: linguagens
        competencia: 1
        habilidade: 4
        resumo: Reconhecer críticas aos usos sociais das linguagens e dos meios de comunicação.
        situacao: a-confirmar
      - area: linguagens
        competencia: 7
        habilidade: 21
        resumo: Reconhecer recursos verbais e não verbais usados para criar ou mudar comportamentos.
        situacao: a-confirmar
    objetos: [lin-generos-digitais-privacidade]
  comunicacao-para-resolver-problemas-sociais:
    enem:
      - area: linguagens
        competencia: 1
        habilidade: 2
        resumo: "Usar o que se sabe sobre os meios de comunicação para resolver problemas sociais."
        situacao: a-confirmar
      - area: linguagens
        competencia: 1
        habilidade: 3
        resumo: "Relacionar as informações dos meios de comunicação à função social que eles têm."
        situacao: a-confirmar
    objetos: [lin-generos-digitais-hipertexto]
  cada-tecnologia-tem-sua-linguagem:
    enem:
      - area: linguagens
        competencia: 9
        habilidade: 29
        resumo: "Identificar as tecnologias da comunicação pela análise das linguagens que elas usam."
        situacao: a-confirmar
      - area: linguagens
        competencia: 9
        habilidade: 28
        resumo: "Reconhecer a função e o impacto social das tecnologias da comunicação e da informação."
        situacao: a-confirmar
    objetos: [lin-generos-digitais-hipertexto]
