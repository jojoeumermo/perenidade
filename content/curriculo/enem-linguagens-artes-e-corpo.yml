        resumo: Reconhecer as funções da arte e o trabalho dos artistas no meio em que vivem.
        situacao: a-confirmar
    objetos: [lin-artes-musica-brasileira]
  arte-como-linguagem-e-patrimonio:
    enem:
      - area: linguagens
        competencia: 4
        habilidade: 12
        resumo: Reconhecer as funções da arte e o trabalho dos artistas no meio em que vivem.
        situacao: a-confirmar
      - area: linguagens
        competencia: 4
        habilidade: 13
        resumo: Analisar obras de arte como forma de explicar culturas, padrões de beleza e preconceitos.
