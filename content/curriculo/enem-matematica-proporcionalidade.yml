# Mapa curricular da trilha enem-matematica-proporcionalidade: cada aula escrita ligada às habilidades da Matriz do Enem
# e aos tópicos de content/enem/matriz.yml. Formato: docs/ENEM.md, seção 5. Tudo a-confirmar até um educador conferir.
fontes:
  - 'Matriz de Referência do Enem, Inep: https://download.inep.gov.br/download/enem/matriz_referencia.pdf'
aulas:
  razao-e-proporcao:
    enem:
      - area: matematica
        competencia: 4
        habilidade: 16
        resumo: Resolver problemas com grandezas direta ou inversamente proporcionais.
        situacao: a-confirmar
      - area: matematica
        competencia: 1
        habilidade: 3
        resumo: Resolver problemas com conhecimentos numéricos.
        situacao: a-confirmar
    objetos: [mat-numeros-razao-e-proporcao]
  porcentagem:
    enem:
      - area: matematica
        competencia: 1
        habilidade: 3
        resumo: Resolver problemas com conhecimentos numéricos.
        situacao: a-confirmar
      - area: matematica
        competencia: 1
        habilidade: 4
        resumo: Julgar se um resultado numérico faz sentido ao discutir uma afirmação com números.
        situacao: a-confirmar
      - area: matematica
        competencia: 4
        habilidade: 16
        resumo: Resolver problemas com grandezas direta ou inversamente proporcionais.
        situacao: a-confirmar
    objetos: [mat-numeros-porcentagem]
