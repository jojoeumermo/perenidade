      - area: matematica
        competencia: 1
        habilidade: 3
        resumo: Resolver problemas com conhecimentos numéricos.
        situacao: a-confirmar
      - area: matematica
        competencia: 1
        habilidade: 5
        resumo: Avaliar propostas de intervenção na realidade usando conhecimentos numéricos.
        situacao: a-confirmar
    objetos: [mat-numeros-contas-do-dia-a-dia]
  unidades-de-medida:
    enem:
      - area: matematica
        competencia: 3
        habilidade: 12
        resumo: Resolver problemas com medidas de grandezas.
        situacao: a-confirmar
      - area: matematica
        competencia: 3
        habilidade: 10
        resumo: Identificar relações entre grandezas e unidades de medida.
        situacao: a-confirmar
    objetos: [mat-geometria-unidades-de-medida]
  escalas:
