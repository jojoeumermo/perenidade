      - area: matematica
        competencia: 3
        habilidade: 11
        resumo: Usar escalas para ler representações do cotidiano.
        situacao: a-confirmar
      - area: matematica
        competencia: 3
        habilidade: 12
        resumo: Resolver problemas com medidas de grandezas.
        situacao: a-confirmar
    objetos: [mat-geometria-escalas]
  grandezas-direta-e-inversamente-proporcionais:
    enem:
      - area: matematica
        competencia: 4
        habilidade: 16
        resumo: Resolver problemas com grandezas direta ou inversamente proporcionais.
        situacao: a-confirmar
      - area: matematica
