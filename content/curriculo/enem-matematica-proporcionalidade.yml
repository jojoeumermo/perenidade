# Mapa curricular da trilha enem-matematica-proporcionalidade: cada aula escrita ligada às habilidades da Matriz do Enem
# e aos tópicos de content/enem/matriz.yml. Formato: docs/ENEM.md, seção 5. Tudo a-confirmar até um educador conferir.
fontes:
  - 'Matriz de Referência do Enem, Inep: https://download.inep.gov.br/download/enem/matriz_referencia.pdf'
aulas:
  razao-e-proporcao:
    enem:
      - area: matematica
        competencia: 4
        habilidade: 16
        resumo: Resolver problemas com grandezas direta ou inversamente proporcionais.
        situacao: a-confirmar
      - area: matematica
        competencia: 1
        habilidade: 3
        resumo: Resolver problemas com conhecimentos numéricos.
        situacao: a-confirmar
    objetos: [mat-numeros-razao-e-proporcao]
  porcentagem:
    enem:
      - area: matematica
        competencia: 1
        habilidade: 3
        resumo: Resolver problemas com conhecimentos numéricos.
        situacao: a-confirmar
      - area: matematica
        competencia: 1
        habilidade: 4
        resumo: Julgar se um resultado numérico faz sentido ao discutir uma afirmação com números.
        situacao: a-confirmar
      - area: matematica
        competencia: 4
        habilidade: 16
        resumo: Resolver problemas com grandezas direta ou inversamente proporcionais.
        situacao: a-confirmar
    objetos: [mat-numeros-porcentagem]
  aumentos-e-descontos-sucessivos:
    enem:
      - area: matematica
        competencia: 1
        habilidade: 3
        resumo: Resolver problemas com conhecimentos numéricos.
        situacao: a-confirmar
      - area: matematica
        competencia: 1
        habilidade: 4
        resumo: Julgar se um resultado numérico faz sentido ao discutir uma afirmação com números.
        situacao: a-confirmar
    objetos: [mat-numeros-aumentos-e-descontos]
  contas-do-dia-a-dia:
    enem:
      - area: matematica
        competencia: 1
        habilidade: 3
        resumo: Resolver problemas com conhecimentos numéricos.
        situacao: a-confirmar
      - area: matematica
        competencia: 1
        habilidade: 5
        resumo: Avaliar propostas de intervenção na realidade usando conhecimentos numéricos.
        situacao: a-confirmar
    objetos: [mat-numeros-contas-do-dia-a-dia]
  unidades-de-medida:
    enem:
      - area: matematica
        competencia: 3
        habilidade: 12
        resumo: Resolver problemas com medidas de grandezas.
        situacao: a-confirmar
      - area: matematica
        competencia: 3
        habilidade: 10
        resumo: Identificar relações entre grandezas e unidades de medida.
        situacao: a-confirmar
    objetos: [mat-geometria-unidades-de-medida]
  escalas:
    enem:
      - area: matematica
        competencia: 3
        habilidade: 11
        resumo: Usar escalas para ler representações do cotidiano.
        situacao: a-confirmar
      - area: matematica
        competencia: 3
        habilidade: 12
        resumo: Resolver problemas com medidas de grandezas.
        situacao: a-confirmar
    objetos: [mat-geometria-escalas]
