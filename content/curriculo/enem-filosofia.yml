# Mapa curricular da trilha enem-filosofia (formato: docs/ENEM.md, seção 5). Tudo a-confirmar.
fontes:
  - >-
    Matriz de Referência do Enem, Inep:
    https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/outros-documentos
aulas:
