      - { area: humanas, competencia: 5, habilidade: 24, resumo: "Relacionar cidadania e democracia na organização das sociedades.", situacao: a-confirmar }
    objetos: [hum-organizacao-social-era-vargas]
  ditadura:
    enem:
      - { area: humanas, competencia: 3, habilidade: 13, resumo: "Analisar a ação de movimentos sociais em mudanças ou rupturas nas disputas pelo poder.", situacao: a-confirmar }
      - { area: humanas, competencia: 3, habilidade: 14, resumo: "Comparar interpretações diferentes sobre fatos ligados às instituições sociais, políticas e econômicas.", situacao: a-confirmar }
      - { area: humanas, competencia: 5, habilidade: 21, resumo: "Identificar o papel dos meios de comunicação na vida social.", situacao: a-confirmar }
      - { area: humanas, competencia: 5, habilidade: 22, resumo: "Analisar lutas sociais e as conquistas que mudaram leis ou políticas públicas.", situacao: a-confirmar }
      - { area: humanas, competencia: 5, habilidade: 24, resumo: "Relacionar cidadania e democracia na organização das sociedades.", situacao: a-confirmar }
