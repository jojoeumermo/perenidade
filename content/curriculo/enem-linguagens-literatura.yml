# Mapa curricular da trilha enem-linguagens-literatura: cada aula escrita ligada às habilidades da Matriz do Enem e aos
# tópicos de content/enem/matriz.yml. Formato: docs/ENEM.md, seção 5. Tudo a-confirmar até um educador conferir.
fontes:
