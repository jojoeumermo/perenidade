    enem:
      - area: linguagens
        competencia: 5
        habilidade: 15
        resumo: Relacionar o texto literário ao momento histórico, social e político em que foi escrito.
        situacao: a-confirmar
      - area: linguagens
        competencia: 5
        habilidade: 16
        resumo: Relacionar a concepção artística de um autor ou movimento ao modo como o texto literário é construído.
        situacao: a-confirmar
      - area: linguagens
        competencia: 5
        habilidade: 17
        resumo: Reconhecer na literatura brasileira valores sociais e humanos que continuam atuais.
        situacao: a-confirmar
