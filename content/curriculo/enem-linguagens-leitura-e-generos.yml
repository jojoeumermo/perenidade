# Mapa curricular da trilha enem-linguagens-leitura-e-generos: cada aula escrita ligada às habilidades da Matriz do Enem
# e aos tópicos de content/enem/matriz.yml. Formato: docs/ENEM.md, seção 5. Tudo a-confirmar até um educador conferir.
fontes:
  - 'Matriz de Referência do Enem, Inep: https://download.inep.gov.br/download/enem/matriz_referencia.pdf'
aulas:
