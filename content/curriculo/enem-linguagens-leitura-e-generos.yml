    enem:
      - area: linguagens
        competencia: 6
        habilidade: 18
        resumo: Identificar o que faz o tema de um texto avançar e como ele se organiza, em vários gêneros e tipos.
        situacao: a-confirmar
      - area: linguagens
        competencia: 7
        habilidade: 23
        resumo: Inferir o objetivo de quem escreveu e o público a quem o texto se dirige, pelos argumentos usados.
        situacao: a-confirmar
    objetos: [lin-texto-estrategias-de-leitura]
