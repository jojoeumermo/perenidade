# Mapa curricular da trilha enem-reta-final: cada aula ligada às habilidades da Matriz do Enem e aos objetos e
# tópicos de content/enem/matriz.yml. Formato: docs/ENEM.md, seção 5. Tudo a-confirmar até um educador conferir.
fontes:
  - 'Matriz de Referência do Enem, Inep: https://download.inep.gov.br/download/enem/matriz_referencia.pdf'
aulas:
  formulario-de-matematica:
    enem:
      - area: matematica
        competencia: 1
        habilidade: 3
        resumo: Resolver problemas com conhecimentos numéricos.
        situacao: a-confirmar
      - area: matematica
        competencia: 2
        habilidade: 8
        resumo: Resolver problemas de geometria de espaço e forma.
        situacao: a-confirmar
      - area: matematica
        competencia: 3
        habilidade: 11
        resumo: Usar escalas para ler representações do cotidiano.
        situacao: a-confirmar
      - area: matematica
        competencia: 4
        habilidade: 16
        resumo: Resolver problemas com grandezas direta ou inversamente proporcionais.
        situacao: a-confirmar
      - area: matematica
        competencia: 5
        habilidade: 21
        resumo: Resolver problemas cuja modelagem pede álgebra.
        situacao: a-confirmar
      - area: matematica
        competencia: 7
        habilidade: 27
        resumo: Calcular médias, moda, mediana ou dispersão de dados em tabelas de frequência ou gráficos.
        situacao: a-confirmar
      - area: matematica
        competencia: 7
        habilidade: 28
        resumo: Resolver problemas de estatística e probabilidade.
        situacao: a-confirmar
