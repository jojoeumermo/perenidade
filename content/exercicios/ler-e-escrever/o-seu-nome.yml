- id: alfa-nome-03
  tema: "Escrever como no documento"
  dificuldade: 2
  enunciado: "Na certidão de Conceição está escrito SOUSA, com S. Como ela deve escrever o sobrenome?"
  alternativas:
    - texto: "SOUZA, com Z, porque o som é de Z"
      erro: "O som é mesmo de Z, mas o nome se escreve como está no documento. Na certidão está SOUSA, com S."
    - texto: "SOUSA, com S, como está na certidão"
      certa: true
    - texto: "Tanto faz"
      erro: "No nome, não é tanto faz: o documento vale. Escrever diferente pode dar problema num cadastro. Siga a certidão: SOUSA."
  explicacao: "O nome se escreve do jeito que o cartório registrou. Se a certidão diz SOUSA, é com S."
  fonte: "Questão original do Instituto Lúcia"
  revisao:
    status: em-revisao

- id: alfa-nome-04
  tema: "Antes de assinar"
  dificuldade: 1
  enunciado: "Alguém do banco pede para Seu Zé assinar um papel com espaços em branco, dizendo que preenche depois. O que ele deve fazer?"
  alternativas:
    - texto: "Assinar, porque é do banco"
      erro: "Ser do banco não basta. Papel em branco pode ser preenchido com qualquer coisa depois da assinatura."
    - texto: "Pôr o dedo no lugar da assinatura"
      erro: "A digital vale como assinatura. O problema não é o jeito de assinar, é o papel em branco."
    - texto: "Não assinar papel em branco; pedir que leiam tudo em voz alta e levar alguém de confiança"
      certa: true
  explicacao: "Assinar é concordar com o que está escrito. Com espaços em branco, ninguém sabe com o que se concorda. Peça a leitura em voz alta e uma cópia."
  fonte: "Questão original do Instituto Lúcia"
  revisao:
    status: em-revisao
