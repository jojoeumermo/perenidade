- id: alfa-nome-01
  tema: "Prenome e sobrenome"
  dificuldade: 1
  nivelamento: true
  enunciado: "No nome ANA PAULA SOUZA, qual é o sobrenome?"
  alternativas:
    - texto: "ANA"
      erro: "ANA é parte do prenome, o nome de chamar. O sobrenome é o nome de família, que vem no fim."
    - texto: "ANA PAULA"
      erro: "ANA PAULA é o prenome inteiro, o nome de chamar. O sobrenome é o de família: SOUZA."
    - texto: "SOUZA"
      certa: true
  explicacao: "O prenome é ANA PAULA, o nome de chamar. O sobrenome, de família, é SOUZA."
  fonte: "Questão original do Instituto Lúcia"
  revisao:
    status: em-revisao

