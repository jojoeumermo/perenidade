# Exercícios da aula "Razão e proporção" (trilha enem-matematica-proporcionalidade).
# Formato: docs/EXERCICIOS.md e docs/ENEM.md, seção 4. Populações e áreas são valores de exemplo.

- id: enem-mat-razao-01
  tema: "Razão e proporção"
  area: matematica
  habilidade: 3
  objeto: mat-numeros-razao-e-proporcao
  dificuldade: 1
  enunciado: "Num ônibus há 15 pessoas sentadas e 45 em pé. Qual é a razão entre o número de pessoas sentadas e o de pessoas em pé?"
  alternativas:
    - texto: "3"
      erro: "3 é a razão invertida: em pé para sentadas (45 ÷ 15). A ordem pedida é sentadas para em pé."
    - texto: "1/3"
      certa: true
    - texto: "1/4"
      erro: "1/4 compara as sentadas com todas as pessoas do ônibus (15 de 60). A pergunta compara sentadas com em pé."
    - texto: "30"
      erro: "30 é a diferença (45 − 15). Razão é uma comparação por divisão."
    - texto: "3/4"
      erro: "3/4 é a parte do ônibus que está em pé (45 de 60). A pergunta pede sentadas para em pé."
  explicacao: "Sentadas para em pé: 15/45. Simplifique por 15: 1/3. Para cada pessoa sentada, há 3 em pé."
  conferir: "15 / 45"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-razao-02
  tema: "Razão e proporção"
  area: matematica
  habilidade: 16
  objeto: mat-numeros-razao-e-proporcao
  dificuldade: 1
  enunciado: "Uma receita de bolo usa 3 xícaras de farinha para cada 2 ovos. Mantendo a mesma proporção, quantas xícaras de farinha vão com 6 ovos?"
  alternativas:
    - texto: "7"
      erro: "Você somou 4 xícaras porque vieram 4 ovos a mais. A proporção multiplica: os ovos foram multiplicados por 3."
    - texto: "6"
      erro: "Você usou uma xícara por ovo. A receita pede 3 xícaras para 2 ovos, ou 1,5 xícara por ovo."
    - texto: "9"
      certa: true
    - texto: "4"
      erro: "Você inverteu a razão (2 xícaras para 3 ovos). A receita põe mais farinha que ovos."
    - texto: "12"
      erro: "Você multiplicou 3 × 4. Os ovos foram de 2 para 6, ou seja, multiplicados por 3."
  explicacao: "Os ovos foram de 2 para 6: multiplicados por 3. A farinha também: 3 × 3 = 9 xícaras."
  conferir: "3 * 6 / 2"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-razao-03
  tema: "Razão e proporção"
  area: matematica
  habilidade: 16
  objeto: mat-numeros-razao-e-proporcao
  dificuldade: 1
  enunciado: "Na proporção x/8 = 15/20, qual é o valor de x?"
  alternativas:
    - texto: "37,5"
      erro: "Você multiplicou 15 × 20 e dividiu por 8. No produto cruzado, x multiplica o 20, e o 8 multiplica o 15: 20x = 120."
    - texto: "3"
      erro: "Você tirou 5 de 8, porque de 15 para 20 faltam 5. Proporção é igualdade de divisões, não de diferenças."
    - texto: "10,7"
      erro: "Você fez 8 × 20 ÷ 15. Confira a posição dos números: x/8 = 15/20 dá 20 · x = 8 · 15."
    - texto: "6"
      certa: true
    - texto: "120"
      erro: "120 é o produto 8 × 15. Falta dividir por 20 para achar x."
  explicacao: "Simplifique 15/20 por 5: 3/4. Então x/8 = 3/4, e x = 6, porque 6/8 = 3/4. Pelo produto cruzado: 20 · x = 120, x = 6."
  conferir: "8 * 15 / 20"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-razao-04
  tema: "Razão e proporção"
  area: matematica
  habilidade: 3
  objeto: mat-numeros-razao-e-proporcao
  estilo: enem
  dificuldade: 2
  texto_base: |
    Para decidir onde abrir uma nova creche, a prefeitura comparou a densidade demográfica (habitantes por quilômetro
    quadrado) de dois bairros. O bairro A tem 24.000 habitantes numa área de 4 km². O bairro B tem 30.000 habitantes
    numa área de 6 km².
  enunciado: "O bairro de maior densidade demográfica e essa densidade são"
  alternativas:
    - texto: "o bairro B, com 5.000 habitantes por km²."
      erro: "O bairro B tem mais habitantes, mas também mais área: 30.000 ÷ 6 = 5.000. O A tem 24.000 ÷ 4 = 6.000, que é mais."
    - texto: "o bairro B, com 30.000 habitantes por km²."
      erro: "30.000 é a população do bairro B, não a densidade. Densidade é população dividida pela área."
    - texto: "o bairro A, com 96.000 habitantes por km²."
      erro: "Você multiplicou a população pela área. Densidade é uma divisão: habitantes por km²."
    - texto: "o bairro A, com 1.000 habitantes por km²."
      erro: "1.000 é a diferença entre as densidades dos dois bairros (6.000 − 5.000), não a densidade do A."
    - texto: "o bairro A, com 6.000 habitantes por km²."
      certa: true
  explicacao: "Bairro A: 24.000 ÷ 4 = 6.000 hab/km². Bairro B: 30.000 ÷ 6 = 5.000 hab/km². O A tem menos gente, mas mais gente por quilômetro quadrado."
  conferir: "24000 / 4"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-razao-05
  tema: "Razão e proporção"
  area: matematica
  habilidade: 16
  objeto: mat-numeros-razao-e-proporcao
  dificuldade: 2
  enunciado: "Duas sócias abriram uma barraca de lanches. Uma investiu R$ 200 e a outra, R$ 400. O lucro do mês, de R$ 900, será dividido em partes proporcionais ao que cada uma investiu. Quanto recebe a sócia que investiu R$ 400?"
  alternativas:
    - texto: "R$ 600"
      certa: true
    - texto: "R$ 450"
      erro: "Você dividiu o lucro ao meio. A divisão é proporcional ao investimento: quem pôs o dobro recebe o dobro."
    - texto: "R$ 300"
      erro: "R$ 300 é a parte de quem investiu R$ 200. A pergunta pede a parte de quem investiu R$ 400."
    - texto: "R$ 400"
      erro: "R$ 400 é o que ela investiu, não a parte dela no lucro."
    - texto: "R$ 700"
      erro: "Você tirou do lucro o investimento da outra sócia (900 − 200). Divida o lucro na razão 200 : 400."
  explicacao: "A razão 200 : 400 é 1 : 2. O lucro se divide em 3 partes de 900 ÷ 3 = 300. Quem investiu R$ 400 fica com 2 partes: 600 reais."
  conferir: "900 * 400 / 600"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-razao-06
  tema: "Razão e proporção"
  area: matematica
  habilidade: 16
  objeto: mat-numeros-razao-e-proporcao
  estilo: enem
  dificuldade: 2
  texto_base: |
    Uma agricultora prepara a terra dos canteiros misturando esterco curtido e terra na razão de 1 para 3, nessa ordem,
    em volume. Para encher os canteiros, ela precisa de 60 litros dessa mistura.
  enunciado: "A quantidade de esterco curtido de que ela precisa é de"
  alternativas:
    - texto: "20 litros."
      erro: "Você dividiu 60 por 3. A razão 1 para 3 compara o esterco com a terra; a mistura tem 1 + 3 = 4 partes."
    - texto: "15 litros."
      certa: true
    - texto: "45 litros."
      erro: "45 litros são a terra (3 partes). A pergunta pede o esterco."
    - texto: "180 litros."
      erro: "Você multiplicou 60 × 3. A mistura inteira tem 60 litros, e o esterco é só uma parte dela."
    - texto: "30 litros."
      erro: "Você dividiu a mistura ao meio, como se a razão fosse 1 para 1."
  explicacao: "A mistura tem 1 + 3 = 4 partes. Cada parte: 60 ÷ 4 = 15 litros. O esterco é 1 parte: 15 litros. A terra é 3 partes: 45 litros."
  conferir: "60 * 1 / 4"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-razao-07
  tema: "Razão e proporção"
  area: matematica
  habilidade: 16
  objeto: mat-numeros-razao-e-proporcao
  dificuldade: 2
  enunciado: "Numa turma de 35 estudantes, a razão entre aprovados e reprovados foi de 5 para 2. Quantos estudantes foram aprovados?"
  alternativas:
    - texto: "14"
      erro: "Você fez 35 × 2 ÷ 5, usando 2/5 como se fosse a parte de reprovados no total. A turma tem 5 + 2 = 7 partes."
    - texto: "10"
      erro: "10 são os reprovados (2 partes de 5). A pergunta pede os aprovados."
    - texto: "25"
      certa: true
    - texto: "17,5"
      erro: "Você dividiu a turma ao meio. A razão 5 : 2 divide a turma em 7 partes."
    - texto: "87,5"
      erro: "Você fez 35 × 5 ÷ 2. O resultado passa do tamanho da turma: algo está invertido."
  explicacao: "A turma tem 5 + 2 = 7 partes. Cada parte: 35 ÷ 7 = 5 estudantes. Aprovados: 5 partes, ou seja, 25."
  conferir: "35 * 5 / 7"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-razao-08
  tema: "Razão e proporção"
  area: matematica
  habilidade: 3
  objeto: mat-numeros-razao-e-proporcao
  estilo: enem
  dificuldade: 3
  texto_base: |
    Um município tem três postos de saúde. O posto A atende 6.000 pessoas com 3 médicos; o posto B, 10.000 pessoas com
    4 médicos; o posto C, 8.400 pessoas com 3 médicos. A prefeitura vai contratar 1 médico e mandá-lo para o posto com
    mais pessoas por médico.
  enunciado: "Depois da contratação, o número de pessoas por médico no posto que recebeu o novo médico será de"
  alternativas:
    - texto: "2.000."
      erro: "2.000 é o número de pessoas por médico no posto A, que é o menos sobrecarregado. O novo médico vai para o C."
    - texto: "2.500."
      erro: "2.500 é o número do posto B. Ele tem mais pessoas, mas o posto C tem mais pessoas por médico (2.800)."
    - texto: "2.800."
      erro: "2.800 é o número do posto C antes da contratação. Com o novo médico, são 4 médicos para 8.400 pessoas."
    - texto: "2.100."
      certa: true
    - texto: "1.680."
      erro: "Você dividiu 8.400 por 5, somando 2 médicos. Chega só 1: o posto C passa de 3 para 4 médicos."
  explicacao: "A: 6.000 ÷ 3 = 2.000. B: 10.000 ÷ 4 = 2.500. C: 8.400 ÷ 3 = 2.800. O novo médico vai para o C, que fica com 4 médicos: 8.400 ÷ 4 = 2.100 pessoas por médico."
  conferir: "8400 / 4"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-razao-09
  tema: "Razão e proporção"
  area: matematica
  habilidade: 16
  objeto: mat-numeros-razao-e-proporcao
  dificuldade: 3
  enunciado: "Um prêmio de R$ 1.800 será dividido entre três grupos de uma feira de cooperativas, em partes proporcionais a 2, 3 e 4. Quanto recebe o grupo que fica com a maior parte?"
  alternativas:
    - texto: "R$ 600"
      erro: "Você dividiu o prêmio em três partes iguais. A divisão é proporcional a 2, 3 e 4: são 9 partes ao todo."
    - texto: "R$ 450"
      erro: "Você dividiu 1.800 por 4. Divida pela soma das partes, 2 + 3 + 4 = 9, e depois multiplique por 4."
    - texto: "R$ 400"
      erro: "R$ 400 é o grupo que fica com a menor parte (2 partes de 200). A pergunta pede a maior."
    - texto: "R$ 200"
      erro: "R$ 200 é o valor de uma parte só. O grupo maior fica com 4 partes."
    - texto: "R$ 800"
      certa: true
  explicacao: "Soma das partes: 2 + 3 + 4 = 9. Uma parte: 1.800 ÷ 9 = 200. Os grupos recebem 400, 600 e 800. O maior: R$ 800. Confira: 400 + 600 + 800 = 1.800."
  conferir: "1800 / (2 + 3 + 4) * 4"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-razao-10
  tema: "Razão e proporção"
  area: matematica
  habilidade: 16
  objeto: mat-numeros-razao-e-proporcao
  estilo: enem
  dificuldade: 3
  texto_base: |
    Um sindicato representa os trabalhadores de duas fábricas. Na fábrica X, que tem 200 trabalhadores, a razão entre o
    número de mulheres e o de homens é de 2 para 3. Na fábrica Y, que tem 100 trabalhadores, essa razão é de 1 para 1.
  enunciado: "Juntando as duas fábricas, a razão entre o número de mulheres e o de homens é"
  alternativas:
    - texto: "13 : 17."
      valor: "13/17"
      certa: true
    - texto: "3 : 4."
      valor: "3/4"
      erro: "Você somou as razões termo a termo (2 + 1 e 3 + 1). As fábricas têm tamanhos diferentes: conte as pessoas de cada uma."
    - texto: "13 : 30."
      valor: "13/30"
      erro: "13 : 30 compara as mulheres com todos os trabalhadores (130 de 300). A pergunta compara mulheres com homens."
    - texto: "9 : 11."
      valor: "9/11"
      erro: "Você fez a média simples das partes de mulheres (2/5 e 1/2). A média ignora que X tem o dobro de trabalhadores de Y."
    - texto: "2 : 3."
      valor: "2/3"
      erro: "2 : 3 é a razão só da fábrica X. Falta juntar a fábrica Y."
  explicacao: "Fábrica X: 2 + 3 = 5 partes de 200 ÷ 5 = 40. Mulheres 80, homens 120. Fábrica Y: 50 mulheres e 50 homens. Juntas: 130 mulheres e 170 homens. Razão 130 : 170 = 13 : 17."
  conferir: "(200 * 2 / 5 + 50) / (200 * 3 / 5 + 50)"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }
