# Exercícios da aula "Umidade, infiltração e impermeabilização" (Construção e reforma). Formato em docs/EXERCICIOS.md.
# Todos em revisão: só uma pessoa da equipe troca para "revisada", com a função e a data.

- id: obra-umidade-01
  tema: "Causas da umidade"
  dificuldade: 1
  nivelamento: true
  enunciado: "Uma mancha de umidade na parte de baixo da parede, que sobe do chão, aponta para qual causa provável?"
  alternativas:
    - texto: "Umidade ascendente, vinda do solo"
      certa: true
    - texto: "Calha entupida no telhado"
      erro: "Calha entupida causa mancha mais alta, perto do teto ou da laje, e depende da chuva."
    - texto: "Condensação no forro do quarto"
      erro: "Condensação aparece em superfícies frias e pouco ventiladas, e não numa mancha que sobe do chão."
  explicacao: "Mancha que começa embaixo e sobe costuma vir do solo ou de falha na impermeabilização das fundações."
  fonte: "Questão original do Instituto Lúcia"
  revisao:
    status: em-revisao

- id: obra-umidade-02
  tema: "Tratar a causa"
  dificuldade: 1
  enunciado: "Por que só pintar por cima de uma parede com infiltração não resolve?"
  alternativas:
    - texto: "Porque a água continua entrando e a tinta volta a descascar e mofar"
      certa: true
    - texto: "Porque a tinta fica pesada demais"
      erro: "O peso da tinta não é o problema. A causa da umidade segue ativa."
    - texto: "Porque a parede precisa descansar por um ano"
      erro: "Não existe esse prazo. O que se faz é descobrir a causa e tratá-la antes de pintar."
  explicacao: "Sem tratar a causa, a umidade volta e estraga o acabamento de novo."
  fonte: "Questão original do Instituto Lúcia"
  revisao:
    status: em-revisao

- id: obra-umidade-03
  tipo: numero
  tema: "Área a impermeabilizar"
  dificuldade: 2
  enunciado: "Um box tem piso de 1 m por 1,2 m e a impermeabilização sobe 1,5 m nas 3 paredes que o cercam, com largura total de 1 + 1,2 + 1 = 3,2 m. Qual é a área total a impermeabilizar (piso mais paredes), em m²?"
  resposta: "6"
  unidade: "m²"
  erros_comuns:
    - resposta: "1,2"
      explicacao: "Essa é só a área do piso (1 × 1,2). Falta a das paredes, que também recebem impermeabilização."
    - resposta: "4,8"
      explicacao: "Essa é só a área das paredes (3,2 × 1,5). Falta somar o piso."
  dica: "Some a área do piso e a das paredes."
  explicacao: "Piso: 1 × 1,2 = 1,2 m². Paredes: 3,2 × 1,5 = 4,8 m². Total: 6 m²."
  conferir: "1 * 1.2 + 3.2 * 1.5"
  fonte: "Questão original do Instituto Lúcia"
  revisao:
    status: em-revisao
