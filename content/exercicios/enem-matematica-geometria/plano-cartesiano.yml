# Exercícios da aula "Plano cartesiano e distância entre pontos" (trilha enem-matematica-geometria).
# Formato: docs/EXERCICIOS.md e docs/ENEM.md, seção 4.

- id: enem-mat-plano-cartesiano-01
  tema: "Plano cartesiano e distância entre pontos"
  area: matematica
  habilidade: 6
  objeto: mat-algebra-geometria-plano-cartesiano
  dificuldade: 1
  enunciado: "Um ponto P fica 3 unidades à esquerda do eixo vertical (eixo y) e 5 unidades acima do eixo horizontal (eixo x). Quais são as coordenadas de P?"
  alternativas:
    - texto: "(−3, 5)"
      certa: true
    - texto: "(3, 5)"
      erro: "Para a esquerda da origem, o x é negativo. O ponto está a 3 unidades à esquerda: x = −3."
    - texto: "(5, −3)"
      erro: "Você trocou a ordem e o sinal. O par é (x, y): primeiro o lado (−3), depois a altura (5)."
    - texto: "(−5, 3)"
      erro: "Você trocou a ordem do par. Primeiro vem o x, o deslocamento para o lado, depois o y."
    - texto: "(3, −5)"
      erro: "Os dois sinais ficaram trocados. Esquerda é x negativo; acima é y positivo."
  explicacao: "À esquerda do eixo y, o x é negativo: x = −3. Acima do eixo x, o y é positivo: y = 5. O ponto é (−3, 5), no 2º quadrante."
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-plano-cartesiano-02
  tema: "Plano cartesiano e distância entre pontos"
  area: matematica
  habilidade: 8
  objeto: mat-algebra-geometria-plano-cartesiano
  dificuldade: 1
  enunciado: "Qual é a distância entre os pontos A(−2, 3) e B(5, 3)?"
  alternativas:
    - texto: "3"
      erro: "Você fez 5 − 2. Mas o x de A é −2: a diferença é 5 − (−2) = 5 + 2 = 7."
    - texto: "8"
      erro: "Você contou as marcas da malha de −2 até 5, incluindo as duas pontas. A distância conta os espaços, não as marcas: 7."
    - texto: "7"
      certa: true
    - texto: "0"
      erro: "Você subtraiu os y (3 − 3). Como os y são iguais, a distância está toda no x."
    - texto: "49"
      erro: "Você elevou a diferença ao quadrado e não tirou a raiz. Na mesma linha, a distância é só a diferença: 7."
  explicacao: "Os dois pontos têm y = 3: estão na mesma linha horizontal. A distância é a diferença dos x: 5 − (−2) = 7."
  conferir: "5 - (-2)"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-plano-cartesiano-03
  tema: "Plano cartesiano e distância entre pontos"
  area: matematica
  habilidade: 8
  objeto: mat-algebra-geometria-plano-cartesiano
  dificuldade: 1
  enunciado: "Qual é a distância, em linha reta, entre os pontos (1, 2) e (4, 6)?"
  alternativas:
    - texto: "7"
      erro: "Você somou as diferenças (3 + 4). Isso é o caminho pelas ruas. Em linha reta, use Pitágoras: √(3² + 4²)."
    - texto: "25"
      erro: "25 é a soma dos quadrados (9 + 16). Falta tirar a raiz quadrada: √25 = 5."
    - texto: "1"
      erro: "Você subtraiu uma diferença da outra (4 − 3). As diferenças são os catetos de um triângulo retângulo."
    - texto: "12"
      erro: "Você multiplicou as diferenças (3 × 4). A distância é a raiz da soma dos quadrados."
    - texto: "5"
      certa: true
  explicacao: "Diferença dos x: 4 − 1 = 3. Diferença dos y: 6 − 2 = 4. Distância: √(9 + 16) = √25 = 5."
  conferir: "sqrt((4-1)^2 + (6-2)^2)"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-plano-cartesiano-04
  tema: "Plano cartesiano e distância entre pontos"
  area: matematica
  habilidade: 6
  objeto: mat-algebra-geometria-plano-cartesiano
  estilo: enem
  dificuldade: 2
  texto_base: |
    A organização de uma feira de bairro fez uma planta do espaço numa malha quadriculada. A barraca de frutas ficou
    no ponto (2, 3) e a barraca de pastel no ponto (10, 7). Um bebedouro será colocado exatamente no meio do segmento
    que liga as duas barracas.
  enunciado: "As coordenadas do bebedouro são"
  alternativas:
    - texto: "(8, 4)"
      erro: "Você fez a diferença (10 − 2 e 7 − 3). Isso é quanto se anda de uma barraca à outra, não o ponto do meio."
    - texto: "(6, 5)"
      certa: true
    - texto: "(12, 10)"
      erro: "Você somou as coordenadas e não dividiu por 2. O ponto médio é a média: some e divida por 2."
    - texto: "(4, 2)"
      erro: "Você dividiu a diferença por 2. Isso é o quanto andar a partir de uma barraca; some ao ponto de partida: (2 + 4, 3 + 2)."
    - texto: "(5, 6)"
      erro: "As contas estão certas, mas as coordenadas ficaram trocadas. O x do meio é (2 + 10) ÷ 2 = 6."
  explicacao: "Ponto médio: x = (2 + 10) ÷ 2 = 6 e y = (3 + 7) ÷ 2 = 5. O bebedouro fica em (6, 5)."
  conferir: "(2 + 10) / 2"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-plano-cartesiano-05
  tema: "Plano cartesiano e distância entre pontos"
  area: matematica
  habilidade: 8
  objeto: mat-algebra-geometria-plano-cartesiano
  dificuldade: 2
  enunciado: "Um triângulo tem vértices nos pontos (0, 0), (9, 0) e (0, 12). Qual é o perímetro desse triângulo?"
  alternativas:
    - texto: "21"
      erro: "Você somou só os dois lados que estão nos eixos (9 + 12). Falta o lado inclinado, a hipotenusa."
    - texto: "54"
      erro: "54 é a área (9 × 12 ÷ 2). O perímetro é a soma dos três lados."
    - texto: "108"
      erro: "Você multiplicou 9 por 12. Perímetro é a soma dos lados, e o terceiro lado sai de Pitágoras."
    - texto: "36"
      certa: true
    - texto: "15"
      erro: "15 é só o lado inclinado. O perímetro soma os três lados: 9 + 12 + 15."
  explicacao: "Dois lados estão nos eixos: 9 e 12. O terceiro vai de (9, 0) a (0, 12): √(9² + 12²) = √(81 + 144) = √225 = 15. Perímetro: 9 + 12 + 15 = 36."
  conferir: "9 + 12 + sqrt(9^2 + 12^2)"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-plano-cartesiano-06
  tema: "Plano cartesiano e distância entre pontos"
  area: matematica
  habilidade: 6
  objeto: mat-algebra-geometria-plano-cartesiano
  estilo: enem
  dificuldade: 2
  texto_base: |
    Num bairro planejado, as ruas formam uma malha quadriculada em que cada quarteirão mede 100 m de lado. A praça
    fica no ponto (0, 0) e a padaria no ponto (3, 4). Uma moradora vai da praça à padaria andando pelas ruas, só na
    horizontal e na vertical. Uma ciclovia nova, em linha reta, ligará a praça à padaria.
  enunciado: "Quantos metros a moradora deixará de andar se usar a ciclovia em vez das ruas?"
  alternativas:
    - texto: "700 m"
      erro: "700 m é o caminho pelas ruas (3 + 4 quarteirões). A pergunta é a diferença entre esse caminho e a linha reta."
    - texto: "200 m"
      certa: true
    - texto: "2 m"
      erro: "A diferença na malha é 2 quarteirões, mas cada quarteirão mede 100 m. Multiplique pela escala."
    - texto: "500 m"
      erro: "500 m é o comprimento da ciclovia. A pergunta é quanto ela economiza em relação às ruas."
    - texto: "1.200 m"
      erro: "Você somou os dois caminhos (700 + 500). A economia é a diferença: 700 − 500."
  explicacao: "Pelas ruas: (3 + 4) × 100 = 700 m. Em linha reta: √(3² + 4²) = 5 quarteirões, 500 m. Economia: 700 − 500 = 200 m."
  conferir: "(3 + 4) * 100 - sqrt(3^2 + 4^2) * 100"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-plano-cartesiano-07
  tema: "Plano cartesiano e distância entre pontos"
  area: matematica
  habilidade: 8
  objeto: mat-algebra-geometria-plano-cartesiano
  dificuldade: 2
  enunciado: "O ponto P(k, 3), com k maior que 1, está a 5 unidades de distância do ponto Q(1, 0). Qual é o valor de k?"
  alternativas:
    - texto: "5"
      certa: true
    - texto: "4"
      erro: "4 é a diferença dos x (o cateto horizontal). O x de P é 1 + 4."
    - texto: "3"
      erro: "3 é a diferença dos y, que já estava dada. O cateto que falta sai de 5² − 3² = 16, ou seja, 4."
    - texto: "6"
      erro: "Você somou a distância inteira ao x de Q (1 + 5). A distância de 5 é a hipotenusa, não o cateto horizontal."
    - texto: "−3"
      erro: "1 − 4 = −3 também fica a 5 unidades de Q, mas o enunciado pede k maior que 1."
  explicacao: "A diferença dos y é 3 − 0 = 3. Pitágoras: 5² = 3² + (k − 1)², então (k − 1)² = 16 e k − 1 = 4. Logo k = 5."
  conferir: "1 + sqrt(5^2 - 3^2)"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-plano-cartesiano-08
  tema: "Plano cartesiano e distância entre pontos"
  area: matematica
  habilidade: 6
  objeto: mat-algebra-geometria-plano-cartesiano
  estilo: enem
  dificuldade: 3
  texto_base: |
    Num mapa de uma zona rural com coordenadas em quilômetros, uma antena de internet está no ponto (−1, 2). O sinal
    dela alcança, em linha reta, até 8 km. Uma escola fica no ponto (5, −6).
  enunciado: "Para ser atendida, a escola precisaria estar mais perto da antena. Quantos quilômetros a escola está além do alcance do sinal?"
  alternativas:
    - texto: "10 km"
      erro: "10 km é a distância da antena até a escola. A pergunta é quanto passa do alcance: 10 − 8."
    - texto: "Nenhum: a escola está dentro do alcance."
      erro: "Provavelmente os sinais se perderam: 5 − (−1) = 6 e −6 − 2 = −8. A distância é √(36 + 64) = 10 km, maior que 8."
    - texto: "6 km"
      erro: "Você somou as diferenças (6 + 8 = 14) e tirou 8. O sinal vai em linha reta: use Pitágoras."
    - texto: "92 km"
      erro: "Você esqueceu a raiz: 36 + 64 = 100, e √100 = 10 km. Depois, 10 − 8."
    - texto: "2 km"
      certa: true
  explicacao: "Diferenças: 5 − (−1) = 6 e −6 − 2 = −8. Distância: √(36 + 64) = √100 = 10 km. Além do alcance: 10 − 8 = 2 km."
  conferir: "sqrt((5 - (-1))^2 + (-6 - 2)^2) - 8"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-plano-cartesiano-09
  tema: "Plano cartesiano e distância entre pontos"
  area: matematica
  habilidade: 8
  objeto: mat-algebra-geometria-plano-cartesiano
  dificuldade: 3
  enunciado: "O ponto médio do segmento AB é M(4, 1). O ponto A é (1, −3). Quais são as coordenadas de B?"
  alternativas:
    - texto: "(2,5; −1)"
      erro: "Você achou o ponto médio entre A e M. M já é o meio de AB; B fica do outro lado de M, à mesma distância."
    - texto: "(3, 4)"
      erro: "Você fez M − A. Isso é o quanto se anda de A até M; ande isso de novo, a partir de M."
    - texto: "(7, 5)"
      certa: true
    - texto: "(5, −2)"
      erro: "Você somou A e M. Pela fórmula, (1 + x) ÷ 2 = 4, então 1 + x = 8 e x = 7."
    - texto: "(−2, −7)"
      erro: "Você achou o simétrico de M em relação a A. Quem está no meio é M, não A."
  explicacao: "Pela média: (1 + x) ÷ 2 = 4, então x = 8 − 1 = 7. E (−3 + y) ÷ 2 = 1, então y = 2 + 3 = 5. B = (7, 5)."
  conferir: "2 * 4 - 1"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-plano-cartesiano-10
  tema: "Plano cartesiano e distância entre pontos"
  area: matematica
  habilidade: 8
  objeto: mat-algebra-geometria-plano-cartesiano
  estilo: enem
  dificuldade: 3
  texto_base: |
    Uma horta comunitária tem a forma de um triângulo. Na planta, desenhada numa malha em que cada unidade vale 10 m,
    os cantos da horta estão nos pontos (0, 0), (15, 0) e (15, 8). Para proteger os canteiros, o grupo vai cercar a
    horta com 3 fios de arame, um acima do outro, em volta de todo o contorno.
  enunciado: "Quantos metros de arame serão necessários, sem contar sobras?"
  alternativas:
    - texto: "400 m"
      erro: "400 m é uma volta só. A cerca tem 3 fios: 400 × 3."
    - texto: "120 m"
      erro: "Você multiplicou o perímetro na malha (40) pelos 3 fios, mas esqueceu a escala: cada unidade vale 10 m."
    - texto: "690 m"
      erro: "Você contou só os lados de 15 e de 8 unidades. Falta o lado inclinado, de 17 unidades, que sai de Pitágoras."
    - texto: "1.200 m"
      certa: true
    - texto: "1.800 m"
      erro: "Você usou a área (15 × 8 ÷ 2 = 60) no lugar do perímetro. Cerca acompanha o contorno: some os lados."
  explicacao: "Lados: 15 e 8 (nas linhas da malha) e √(15² + 8²) = √289 = 17. Perímetro: 40 unidades, 400 m. Três fios: 3 × 400 = 1.200 m."
  conferir: "(15 + 8 + sqrt(15^2 + 8^2)) * 10 * 3"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }
