# Exercícios da aula "Esfera" (trilha enem-matematica-geometria).
# Formato: docs/EXERCICIOS.md e docs/ENEM.md, seção 4.

- id: enem-mat-esfera-01
  tema: "Esfera"
  area: matematica
  habilidade: 8
  objeto: mat-geometria-esfera
  dificuldade: 1
  enunciado: "Uma bola maciça tem 10 cm de raio. Usando π = 3, qual é o volume da bola?"
  alternativas:
    - texto: "4.000 cm³"
      certa: true
    - texto: "1.200 cm³"
      erro: "1.200 é a área da superfície (4 × 3 × 100), em cm². O volume usa o raio ao cubo: 4 · π · r³ ÷ 3."
    - texto: "12.000 cm³"
      erro: "Você esqueceu de dividir por 3. V = 4 × 3 × 1.000 ÷ 3."
    - texto: "400 cm³"
      erro: "Você fez 4 × r² (4 × 100), sem π e com o raio ao quadrado. No volume, o raio vai ao cubo."
    - texto: "3.000 cm³"
      erro: "Você fez só π · r³ (3 × 1.000). Falta o fator 4 ÷ 3."
  explicacao: "V = 4 · π · r³ ÷ 3 = 4 × 3 × 1.000 ÷ 3. O 3 de π se cancela com o 3 de baixo: 4 × 1.000 = 4.000 cm³."
  conferir: "4 * 3 * 10^3 / 3"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-esfera-02
  tema: "Esfera"
  area: matematica
  habilidade: 8
  objeto: mat-geometria-esfera
  dificuldade: 1
  enunciado: "Uma bola de borracha tem 10 cm de diâmetro. Usando π = 3,14, qual é a área da superfície da bola?"
  alternativas:
    - texto: "78,5 cm²"
      erro: "78,5 é a área de um círculo de raio 5 (π · r²). A superfície da esfera é quatro círculos desses: 4 · π · r²."
    - texto: "314 cm²"
      certa: true
    - texto: "1.256 cm²"
      erro: "Você usou o diâmetro (10 cm) como raio: 4 × 3,14 × 100. O raio é 5 cm."
    - texto: "31,4 cm²"
      erro: "31,4 é o comprimento do círculo máximo (2 × 3,14 × 5), em cm. A superfície é 4 · π · r²."
    - texto: "62,8 cm²"
      erro: "Você fez 4 · π · r sem elevar o raio ao quadrado. A superfície é 4 × 3,14 × 25."
  explicacao: "Raio: 10 ÷ 2 = 5 cm. A = 4 · π · r² = 4 × 3,14 × 25 = 3,14 × 100 = 314 cm²."
  conferir: "4 * 3.14 * 5^2"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-esfera-03
  tema: "Esfera"
  area: matematica
  habilidade: 8
  objeto: mat-geometria-esfera
  dificuldade: 1
  enunciado: "Uma cúpula tem a forma de um hemisfério (meia esfera) com 2 m de raio. Usando π = 3, qual é o volume de ar dentro dela?"
  alternativas:
    - texto: "32 m³"
      erro: "32 m³ é a esfera inteira. A cúpula é meia esfera: 32 ÷ 2."
    - texto: "48 m³"
      erro: "48 é a área da superfície da esfera inteira (4 × 3 × 4), em m². A pergunta é volume, e de meia esfera."
    - texto: "16 m³"
      certa: true
    - texto: "12 m³"
      erro: "12 é π · r² (3 × 4), a área do círculo do chão da cúpula. O volume usa r³ e o fator 4 ÷ 3."
    - texto: "8 m³"
      erro: "8 é só o raio ao cubo (2³). Falta multiplicar por 4 · π ÷ 3 e dividir por 2."
  explicacao: "Esfera: 4 × 3 × 8 ÷ 3 = 32 m³. Hemisfério: 32 ÷ 2 = 16 m³."
  conferir: "(4 * 3 * 2^3 / 3) / 2"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-esfera-04
  tema: "Esfera"
  area: matematica
  habilidade: 12
  objeto: mat-geometria-esfera
  estilo: enem
  dificuldade: 2
  texto_base: |
    Uma cooperativa costura bolas de futebol de couro. Cada bola tem 10 cm de raio. Para uma encomenda de 100 bolas,
    é preciso saber quanto couro comprar, desprezando costuras e sobras. Use π = 3 e lembre que 1 m² = 10.000 cm².
  enunciado: "A quantidade de couro necessária para a encomenda é de"
  alternativas:
    - texto: "120 m²"
      erro: "Você usou 1 m² = 1.000 cm². Em área, 1 m² = 100 × 100 = 10.000 cm²."
    - texto: "1,2 m²"
      erro: "Você dividiu 120.000 cm² por 100.000. A ponte é 1 m² = 10.000 cm²."
    - texto: "3 m²"
      erro: "Você usou π · r² (300 cm² por bola), a área de um círculo só. A superfície da esfera é 4 · π · r²."
    - texto: "12 m²"
      certa: true
    - texto: "40 m²"
      erro: "Você usou o volume de cada bola (4.000 cm³) no lugar da superfície. Couro cobre a superfície: 4 · π · r²."
  explicacao: "Superfície de uma bola: 4 × 3 × 100 = 1.200 cm². Cem bolas: 120.000 cm². Em m²: 120.000 ÷ 10.000 = 12 m²."
  conferir: "100 * 4 * 3 * 10^2 / 10000"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-esfera-05
  tema: "Esfera"
  area: matematica
  habilidade: 7
  objeto: mat-geometria-esfera
  dificuldade: 2
  enunciado: "Uma bola de 3 cm de raio está guardada numa caixa cúbica de 6 cm de aresta, encostando em todas as faces. Usando π = 3, que fração do volume da caixa a bola ocupa?"
  alternativas:
    - texto: "1/3"
      erro: "1/3 é a fração do cone dentro do cilindro de mesma base e altura. Faça a conta da esfera: 108 ÷ 216."
    - texto: "2/3"
      erro: "2/3 é a fração da esfera dentro do cilindro que a envolve (Arquimedes). Aqui a caixa é um cubo, que tem os cantos a mais."
    - texto: "3/4"
      erro: "Você inverteu o fator 4/3 da fórmula. Calcule os dois volumes: esfera 108 cm³, cubo 216 cm³."
    - texto: "2"
      erro: "Você dividiu o cubo pela esfera (216 ÷ 108). A fração ocupada é a esfera dividida pela caixa."
    - texto: "1/2"
      certa: true
  explicacao: "Esfera: 4 × 3 × 27 ÷ 3 = 108 cm³. Cubo: 6 × 6 × 6 = 216 cm³. Fração: 108 ÷ 216 = 1/2. (Com π = 3,14, daria um pouco mais que a metade.)"
  conferir: "(4 * 3 * 3^3 / 3) / 6^3"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-esfera-06
  tema: "Esfera"
  area: matematica
  habilidade: 8
  objeto: mat-geometria-esfera
  dificuldade: 2
  enunciado: "Um balão de festa, esférico, é enchido até o diâmetro dobrar. O volume de ar dentro dele fica multiplicado por quanto?"
  alternativas:
    - texto: "8 vezes"
      certa: true
    - texto: "2 vezes"
      erro: "O diâmetro dobrou, mas o volume depende do raio ao cubo. O fator é 2 × 2 × 2."
    - texto: "4 vezes"
      erro: "4 vezes é o que acontece com a superfície (raio ao quadrado). O volume tem o raio ao cubo: 2³ = 8."
    - texto: "6 vezes"
      erro: "Você multiplicou 2 por 3 em vez de elevar ao cubo. 2³ = 2 × 2 × 2 = 8."
    - texto: "16 vezes"
      erro: "Você elevou 2 à quarta potência. No volume, o raio vai ao cubo: 2³ = 8."
  explicacao: "Diâmetro dobra, raio dobra. V = 4 · π · r³ ÷ 3; com 2r, fica 4 · π · 8r³ ÷ 3: oito vezes o volume antigo."
  conferir: "2^3"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-esfera-07
  tema: "Esfera"
  area: matematica
  habilidade: 12
  objeto: mat-geometria-esfera
  estilo: enem
  dificuldade: 2
  texto_base: |
    Um reservatório de água tem a forma de uma esfera com 2 m de raio interno. Uma bomba leva 8 horas para enchê-lo
    completamente, sempre com a mesma vazão. Use π = 3 e lembre que 1 m³ = 1.000 L.
  enunciado: "A vazão da bomba, em litro por hora, é de"
  alternativas:
    - texto: "6.000"
      erro: "Você usou a superfície da esfera (48 m²) no lugar do volume. Água ocupa volume: 4 · π · r³ ÷ 3 = 32 m³."
    - texto: "4.000"
      certa: true
    - texto: "12.000"
      erro: "Você esqueceu de dividir por 3 na fórmula do volume (96 m³ em vez de 32 m³)."
    - texto: "256.000"
      erro: "Você multiplicou o volume pelas horas. Vazão é volume dividido pelo tempo: 32.000 ÷ 8."
    - texto: "4"
      erro: "Você não converteu metro cúbico para litro. 32 m³ são 32.000 L; divida esse valor por 8."
  explicacao: "Volume: 4 × 3 × 8 ÷ 3 = 32 m³ = 32.000 L. Vazão: 32.000 ÷ 8 = 4.000 L por hora."
  conferir: "(4 * 3 * 2^3 / 3) * 1000 / 8"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-esfera-08
  tema: "Esfera"
  area: matematica
  habilidade: 9
  objeto: mat-geometria-esfera
  dificuldade: 3
  enunciado: "Três bolas de tênis de 3 cm de raio vêm empilhadas num tubo cilíndrico de 3 cm de raio e 18 cm de altura, que elas preenchem de ponta a ponta. Usando π = 3, que fração do volume do tubo fica vazia?"
  alternativas:
    - texto: "2/3"
      erro: "2/3 é a parte ocupada pelas bolas (324 de 486). A pergunta é a parte vazia: 1 − 2/3."
    - texto: "1/2"
      erro: "Você dividiu o vazio (162) pelo volume das bolas (324). A fração é do tubo: divida por 486."
    - texto: "1/3"
      certa: true
    - texto: "7/9"
      erro: "Você descontou uma bola só (486 − 108 = 378). São três bolas: 3 × 108 = 324."
    - texto: "3/2"
      erro: "Você dividiu o tubo pelas bolas (486 ÷ 324). Uma fração do tubo não pode passar de 1."
  explicacao: "Tubo: 3 × 9 × 18 = 486 cm³. Cada bola: 4 × 3 × 27 ÷ 3 = 108 cm³; três bolas: 324 cm³. Vazio: 486 − 324 = 162. Fração: 162 ÷ 486 = 1/3. É Arquimedes de novo: as esferas ocupam 2/3 do cilindro."
  conferir: "(3 * 3^2 * 18 - 3 * (4 * 3 * 3^3 / 3)) / (3 * 3^2 * 18)"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-esfera-09
  tema: "Esfera"
  area: matematica
  habilidade: 8
  objeto: mat-geometria-esfera
  estilo: enem
  dificuldade: 3
  texto_base: |
    Uma escola pintou a superfície de um globo terrestre de 30 cm de raio e gastou 0,5 L de tinta. Agora vai pintar,
    com a mesma tinta e a mesma espessura de camada, um globo de 60 cm de raio.
  enunciado: "A quantidade de tinta necessária para o globo maior é de"
  alternativas:
    - texto: "1 L"
      erro: "Você dobrou a tinta porque o raio dobrou. A tinta cobre a superfície, que depende do raio ao quadrado: 2² = 4."
    - texto: "4 L"
      erro: "Você multiplicou por 8, como se a tinta enchesse o globo. Ela só cobre a superfície: multiplique por 4."
    - texto: "0,5 L"
      erro: "O globo maior tem mais superfície para cobrir. A área cresce com o quadrado do raio."
    - texto: "2 L"
      certa: true
    - texto: "1,5 L"
      erro: "Você somou 1 L, como se cada 30 cm a mais pedisse 1 L. A área não cresce somando: ela fica (60 ÷ 30)² = 4 vezes maior."
  explicacao: "A superfície é 4 · π · r². O raio dobrou, então a superfície ficou 2² = 4 vezes maior. Tinta: 0,5 × 4 = 2 L."
  conferir: "0.5 * (60 / 30)^2"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-esfera-10
  tema: "Esfera"
  area: matematica
  habilidade: 8
  objeto: mat-geometria-esfera
  estilo: enem
  dificuldade: 3
  texto_base: |
    Numa feira, uma melancia esférica de 30 cm de diâmetro é cortada ao meio, passando pelo centro. Cada metade vai ser
    embrulhada em filme plástico, cobrindo a casca curva e também a face plana do corte. Use π = 3.
  enunciado: "A área de filme plástico necessária para embrulhar uma das metades, sem sobras, é de"
  alternativas:
    - texto: "1.350 cm²"
      erro: "1.350 cm² é só a casca curva (metade de 4 · π · r²). Falta o círculo do corte, π · r² = 675 cm²."
    - texto: "2.700 cm²"
      erro: "2.700 cm² é a casca da melancia inteira. Uma metade tem metade da casca, mais o círculo do corte."
    - texto: "675 cm²"
      erro: "675 cm² é só a face plana do corte. Falta a casca curva da metade, 2 · π · r² = 1.350 cm²."
    - texto: "8.100 cm²"
      erro: "Você usou o diâmetro (30 cm) como raio. O raio é 15 cm."
    - texto: "2.025 cm²"
      certa: true
  explicacao: "Raio: 15 cm. Casca curva da metade: 2 × 3 × 225 = 1.350 cm². Corte: 3 × 225 = 675 cm². Total: 1.350 + 675 = 2.025 cm²."
  conferir: "2 * 3 * 15^2 + 3 * 15^2"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }
