- id: portugues-fundamental-pontuacao-ponto-virgula-e-companhia-01
  tema: "Vírgula"
  dificuldade: 1
  enunciado: "Segundo a aula, a vírgula marca o quê?"
  alternativas:
    - texto: "Onde se respira"
      erro: "A aula diz o contrário."
    - texto: "A organização da frase"
      certa: true
    - texto: "Onde a voz sobe"
      erro: "A vírgula marca a organização da frase."
  explicacao: "Há pausas na fala sem vírgula na escrita, e vírgulas na escrita sem pausa na fala."
  fonte: "Questão original do Instituto Lúcia, baseada na aula \"Pontuação: ponto, vírgula e companhia\""
  revisao:
    status: em-revisao

- id: portugues-fundamental-pontuacao-ponto-virgula-e-companhia-02
  tema: "Vocativo"
  dificuldade: 2
  enunciado: "Qual frase isola o chamamento (vocativo) com vírgula corretamente?"
  alternativas:
