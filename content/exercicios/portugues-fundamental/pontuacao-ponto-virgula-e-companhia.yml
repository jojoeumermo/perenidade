- id: portugues-fundamental-pontuacao-ponto-virgula-e-companhia-03
  tema: "Na dúvida"
  dificuldade: 1
  enunciado: "Qual é a regra de estilo mais útil da aula na dúvida?"
  alternativas:
    - texto: "Na dúvida, ponto: frases curtas raramente dão errado"
      certa: true
    - texto: "Na dúvida, vírgula"
      erro: "A aula diz \"na dúvida, ponto\"."
    - texto: "Na dúvida, reticências"
      erro: "Não é a regra da aula."
  explicacao: "Um período de cinco linhas, cheio de vírgulas, quase sempre pode virar três frases claras."
