# Exercícios da aula "Amplitude, variância e desvio padrão" (trilha enem-matematica-estatistica-e-probabilidade).
# Formato: docs/EXERCICIOS.md e docs/ENEM.md, seção 4.

- id: enem-mat-dispersao-01
  tema: "Amplitude, variância e desvio padrão"
  area: matematica
  competencia: 7
  habilidade: 27
  objeto: mat-estatistica-dispersao
  dificuldade: 1
  enunciado: "As temperaturas máximas de uma cidade em cinco dias foram 18 °C, 25 °C, 21 °C, 30 °C e 16 °C. Qual foi a amplitude dessas temperaturas?"
  alternativas:
    - texto: "22 °C"
      erro: "22 °C é a média (110 ÷ 5). A amplitude é o maior valor menos o menor."
    - texto: "14 °C"
      certa: true
    - texto: "30 °C"
      erro: "30 °C é só a maior temperatura. Falta tirar a menor."
    - texto: "16 °C"
      erro: "16 °C é só a menor temperatura. A amplitude é a diferença entre a maior e a menor."
    - texto: "12 °C"
      erro: "Você fez 30 − 18, usando a primeira temperatura da lista. A menor é 16 °C."
  explicacao: "Amplitude = maior − menor = 30 − 16 = 14 °C."
  conferir: "30 - 16"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-dispersao-02
  tema: "Amplitude, variância e desvio padrão"
  area: matematica
  competencia: 7
  habilidade: 27
  objeto: mat-estatistica-dispersao
  dificuldade: 1
  enunciado: "Uma padaria vendeu exatamente 5 bolos em cada um dos quatro dias de uma semana em que anotou as vendas. Qual é o desvio padrão dessas vendas?"
  alternativas:
    - texto: "5"
      erro: "5 é a média. O desvio padrão mede o quanto os valores se afastam dela, e aqui nenhum se afasta."
    - texto: "1"
      erro: "Todos os valores são iguais à média: cada desvio é 0, e não 1."
    - texto: "20"
      erro: "20 é o total de bolos vendidos. O desvio padrão mede espalhamento, não quantidade."
    - texto: "25"
      erro: "25 é 5 ao quadrado. Os desvios é que vão ao quadrado, e aqui todos valem 0."
    - texto: "0"
      certa: true
  explicacao: "A média é 5 e todos os valores são 5. Os desvios são todos 0, a variância é 0 e o desvio padrão é 0. Dados todos iguais não têm espalhamento."
  conferir: "0"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-dispersao-03
  tema: "Amplitude, variância e desvio padrão"
  area: matematica
  competencia: 7
  habilidade: 27
  objeto: mat-estatistica-dispersao
  dificuldade: 1
  enunciado: "A média de um conjunto de notas é 10. Qual é o desvio da nota 7 em relação à média?"
  alternativas:
    - texto: "−3"
      certa: true
    - texto: "3"
      erro: "O desvio é valor − média: 7 − 10. Como a nota está abaixo da média, o desvio é negativo."
    - texto: "17"
      erro: "Você somou a nota e a média. O desvio é a diferença: valor − média."
    - texto: "9"
      erro: "9 é o quadrado do desvio, usado na variância. O desvio em si é −3."
    - texto: "0,7"
      erro: "Você dividiu 7 por 10. O desvio é uma subtração, não uma divisão."
  explicacao: "Desvio = valor − média = 7 − 10 = −3. O sinal negativo diz que a nota ficou abaixo da média."
  conferir: "7 - 10"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-dispersao-04
  tema: "Amplitude, variância e desvio padrão"
  area: matematica
  competencia: 7
  habilidade: 27
  objeto: mat-estatistica-dispersao
  dificuldade: 2
  enunciado: "Qual é a variância dos números 1, 3, 5, 7 e 9, dividindo pelo número de dados?"
  alternativas:
    - texto: "40"
      erro: "40 é a soma dos quadrados dos desvios. Falta dividir pelos 5 dados."
    - texto: "0"
      erro: "0 é a soma dos desvios sem elevar ao quadrado. Ela sempre dá zero; por isso a variância usa os quadrados."
    - texto: "10"
      erro: "Você dividiu 40 por 4. O enunciado manda dividir pelo número de dados, 5."
    - texto: "8"
      certa: true
    - texto: "2,4"
      erro: "2,4 é a média das distâncias sem elevar ao quadrado (12 ÷ 5). A variância usa os quadrados dos desvios."
  explicacao: "Média: 25 ÷ 5 = 5. Desvios: −4, −2, 0, 2 e 4. Quadrados: 16, 4, 0, 4 e 16, que somam 40. Variância: 40 ÷ 5 = 8."
  conferir: "(16 + 4 + 0 + 4 + 16) / 5"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-dispersao-05
  tema: "Amplitude, variância e desvio padrão"
  area: matematica
  competencia: 7
  habilidade: 27
  objeto: mat-estatistica-dispersao
  estilo: enem
  dificuldade: 2
  texto_base: |
    O setor de pessoal de uma pequena empresa anotou o número de faltas de 8 funcionários num semestre:
    2, 4, 4, 4, 5, 5, 7 e 9. Para analisar esses dados, o setor calculou a média, a variância (a média dos
    quadrados dos desvios em relação à média) e o desvio padrão (a raiz quadrada da variância).
  enunciado: "O desvio padrão do número de faltas é"
  alternativas:
    - texto: "4"
      erro: "4 é a variância. O desvio padrão é a raiz quadrada dela."
    - texto: "32"
      erro: "32 é a soma dos quadrados dos desvios. Falta dividir por 8 e tirar a raiz."
    - texto: "2"
      certa: true
    - texto: "5"
      erro: "5 é a média das faltas (40 ÷ 8). O desvio padrão mede o espalhamento em torno dela."
    - texto: "7"
      erro: "7 é a amplitude (9 − 2). Ela olha só para os extremos."
  explicacao: "Média: 40 ÷ 8 = 5. Desvios: −3, −1, −1, −1, 0, 0, 2 e 4. Quadrados: 9, 1, 1, 1, 0, 0, 4 e 16, que somam 32. Variância: 32 ÷ 8 = 4. Desvio padrão: √4 = 2."
  conferir: "(32 / 8) ^ 0.5"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-dispersao-06
  tema: "Amplitude, variância e desvio padrão"
  area: matematica
  competencia: 7
  habilidade: 29
  objeto: mat-estatistica-dispersao
  dificuldade: 2
  texto_base: |
    Três costureiras de uma cooperativa fazem, em média, 40 peças por dia. Os desvios padrão da produção diária são:
    Rosa, 3 peças; Lia, 7 peças; Bia, 5 peças.
  enunciado: "Qual costureira tem a produção mais regular?"
  alternativas:
    - texto: "Rosa"
      certa: true
    - texto: "Lia"
      erro: "Lia tem o maior desvio padrão: a produção dela é a que mais varia de um dia para o outro."
    - texto: "Bia"
      erro: "Bia fica no meio. O desvio padrão de Rosa (3) é menor que o dela (5)."
    - texto: "As três, porque a média é a mesma"
      erro: "Média igual não quer dizer regularidade igual. Quem mede a regularidade é o desvio padrão."
    - texto: "Não dá para saber sem os dados de cada dia"
      erro: "O desvio padrão já resume o espalhamento dos dados de cada dia. Com ele, dá para comparar."
  explicacao: "Mais regular é quem tem o menor desvio padrão: os valores ficam mais perto da média. Rosa, com 3 peças."
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-dispersao-07
  tema: "Amplitude, variância e desvio padrão"
  area: matematica
  competencia: 7
  habilidade: 27
  objeto: mat-estatistica-dispersao
  estilo: enem
  dificuldade: 2
  texto_base: |
    Uma escola comparou as notas de duas turmas numa mesma prova. A variância das notas da turma X foi 2,25, e a da
    turma Y foi 6,25. O desvio padrão é a raiz quadrada da variância.
  enunciado: "A diferença entre o desvio padrão das notas da turma Y e o da turma X é"
  alternativas:
    - texto: "4"
      erro: "4 é a diferença entre as variâncias (6,25 − 2,25). Tire a raiz de cada uma antes de subtrair."
    - texto: "2,5"
      erro: "2,5 é só o desvio padrão da turma Y. Falta tirar o da turma X."
    - texto: "1"
      certa: true
    - texto: "1,5"
      erro: "1,5 é só o desvio padrão da turma X. A pergunta é a diferença entre os dois."
    - texto: "8,5"
      erro: "8,5 é a soma das variâncias. A pergunta pede a diferença entre os desvios padrão."
  explicacao: "Desvio padrão de X: √2,25 = 1,5. De Y: √6,25 = 2,5. Diferença: 2,5 − 1,5 = 1. Repare que a raiz de 4 (a diferença das variâncias) daria 2, e não 1: tire a raiz de cada uma antes de subtrair."
  conferir: "6.25 ^ 0.5 - 2.25 ^ 0.5"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-dispersao-08
  tema: "Amplitude, variância e desvio padrão"
  area: matematica
  competencia: 7
  habilidade: 29
  objeto: mat-estatistica-dispersao
  estilo: enem
  dificuldade: 3
  texto_base: |
    Uma cooperativa de entregas por bicicleta vai indicar um entregador para um contrato com o mercado do bairro. O
    critério é escolher quem tem o menor tempo médio de entrega; em caso de empate, escolhe-se quem tem o menor
    desvio padrão. Os dados de cada entregador estão a seguir (tempo médio; desvio padrão): Ana, 30 min e 6 min;
    Bruno, 28 min e 9 min; Carla, 35 min e 2 min; Davi, 29 min e 3 min; Elisa, 28 min e 4 min.
  enunciado: "O entregador indicado será"
  alternativas:
    - texto: "Ana."
      erro: "Ana tem média de 30 min. Há quem faça em menos tempo, em média: Bruno e Elisa, com 28 min."
    - texto: "Bruno."
      erro: "Bruno empata com Elisa no menor tempo médio, mas o desvio padrão dele (9 min) é maior. O desempate favorece Elisa."
    - texto: "Carla."
      erro: "Carla tem o menor desvio padrão, mas a maior média. O primeiro critério é o tempo médio."
    - texto: "Davi."
      erro: "Davi tem desvio padrão baixo, mas média de 29 min. O desvio padrão só entra para desempatar quem tem o menor tempo médio."
    - texto: "Elisa."
      certa: true
  explicacao: "Primeiro critério: menor tempo médio. Bruno e Elisa empatam com 28 min. Desempate: menor desvio padrão. Elisa tem 4 min e Bruno, 9 min. Elisa é a indicada."
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-dispersao-09
  tema: "Amplitude, variância e desvio padrão"
  area: matematica
  competencia: 7
  habilidade: 27
  objeto: mat-estatistica-dispersao
  estilo: enem
  dificuldade: 3
  texto_base: |
    Uma horta comunitária anotou a colheita de alface, em quilogramas, em cinco dias: 12, 15, 9, 14 e 10. A
    variância é a média dos quadrados das diferenças entre cada valor e a média dos valores.
  enunciado: "A variância da colheita nesses cinco dias, em kg², é"
  alternativas:
    - texto: "26"
      erro: "26 é a soma dos quadrados dos desvios. Falta dividir pelos 5 dias."
    - texto: "6,5"
      erro: "Você dividiu 26 por 4. O texto define a variância como uma média: divida pelos 5 valores."
    - texto: "0"
      erro: "0 é a soma dos desvios sem elevar ao quadrado. Ela sempre dá zero."
    - texto: "5,2"
      certa: true
    - texto: "6"
      erro: "6 é a amplitude (15 − 9). Ela não é a variância."
  explicacao: "Média: 60 ÷ 5 = 12. Desvios: 0, 3, −3, 2 e −2. Quadrados: 0, 9, 9, 4 e 4, que somam 26. Variância: 26 ÷ 5 = 5,2 kg²."
  conferir: "(0 + 9 + 9 + 4 + 4) / 5"
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }

- id: enem-mat-dispersao-10
  tema: "Amplitude, variância e desvio padrão"
  area: matematica
  competencia: 7
  habilidade: 29
  objeto: mat-estatistica-dispersao
  dificuldade: 3
  enunciado: "Numa empresa, todos os salários recebem um aumento de R$ 100,00, o mesmo valor para todo mundo. O que acontece com a média e com o desvio padrão dos salários?"
  alternativas:
    - texto: "Os dois aumentam R$ 100,00."
      erro: "A média sobe 100, mas cada salário continua à mesma distância da nova média. O espalhamento não muda."
    - texto: "A média aumenta R$ 100,00, e o desvio padrão não muda."
      certa: true
    - texto: "A média não muda, e o desvio padrão aumenta R$ 100,00."
      erro: "É o contrário: todos os valores subiram 100, então a média sobe 100. As distâncias até a média continuam as mesmas."
    - texto: "Nenhum dos dois muda."
      erro: "A média muda: se todo mundo ganha 100 a mais, a média também sobe 100."
    - texto: "A média aumenta R$ 100,00, e o desvio padrão aumenta R$ 10,00."
      erro: "O desvio padrão mede as distâncias até a média. Somar o mesmo valor a todos não muda nenhuma dessas distâncias."
  explicacao: "Teste com 1.000, 1.200 e 1.400: a média é 1.200 e os desvios são −200, 0 e 200. Depois do aumento, 1.100, 1.300 e 1.500: a média é 1.300 e os desvios continuam −200, 0 e 200. A média sobe 100; o desvio padrão fica igual."
  fonte: "Questão original do Instituto Lúcia"
  revisao: { status: em-revisao }
