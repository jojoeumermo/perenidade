# Camada do Instituto Lúcia sobre a prova de Ciências da Natureza do ENEM 2023 (questões 91 a 135).
# Formato: docs/ENEM.md, seção 6. Classificação proposta pela equipe (situacao: a-confirmar).
# Fora deste arquivo: enem-2023-132 (no arquivo importado, as alternativas A a D vieram vazias, sem os gráficos).
# Avisos sobre a importação: enem-2023-100 aparece duas vezes no JSON; em enem-2023-99 falta a pergunta final
