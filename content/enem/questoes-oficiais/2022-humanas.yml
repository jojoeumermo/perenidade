    resolucao: |
      O trecho do escritor uruguaio Eduardo Galeano descreve as sociedades que os espanhóis encontraram na América: o império dos incas, os astecas no vale do México e os maias. Fala de conhecimentos próprios: os maias foram grandes astrônomos, mediram o tempo com precisão e conheceram o zero; os cirurgiões incas operavam crânios.
      O comando pede o que essas sociedades deixaram como legado. O texto destaca saberes criados por esses povos, antes e sem a influência europeia: astronomia, matemática, medicina.
      Heranças culturais constituídas de saberes próprios. Alternativa C.
    enganos:
      A: "Esses povos tinham suas próprias religiões. O cristianismo chegou com os espanhóis. Dizer que o legado tem matriz cristã é anacronismo."
      B: "O texto não fala de armas tomadas em batalha. Fala de saberes. Não troque o legado por um episódio da conquista."
      D: "O texto destaca o que esses povos criaram por si. Dizer que seus costumes foram moldados por estrangeiros inverte o sentido."
      E: "A cirurgia inca aparece, mas chamá-la de “conhecimento científico” no sentido moderno é anacronismo. E a alternativa deixa de fora a astronomia e a matemática."
