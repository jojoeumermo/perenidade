  - id: enem-2022-90
    area: humanas
    competencia: 6
    habilidade: 26
    objeto: hum-ambiente
    topico: hum-ambiente-sociedade-e-natureza
    dificuldade: 1
    situacao: a-confirmar
    gabarito: A
    resolucao: |
      O texto apresenta as paneleiras de Goiabeiras, em Vitória (ES), mulheres que fazem as panelas de barro da culinária capixaba. O saber passa de mãe para filha e mistura origens indígena, africana e portuguesa. As matérias-primas vêm da natureza: argila do barreiro, madeira e tinta da casca do mangue-vermelho. Em 2002, o Iphan registrou o ofício das paneleiras de Goiabeiras como o primeiro bem do Livro de Registro dos Saberes, do patrimônio imaterial do Brasil.
      O comando pede o que essas práticas tradicionais ligam aos recursos naturais. O uso do barro e do mangue sustenta um ofício, uma renda, uma tradição de família e uma identidade. Ou seja, garante que esse jeito de viver continue.
      Manutenção dos modos de vida. Alternativa A.
    enganos:
      B: "O texto fala de barro, madeira e mangue, não de roça. Não troque a atividade descrita."
      C: "O texto valoriza a tradição passada entre gerações, não a modernização da gestão. A alternativa vai no sentido contrário."
      D: "As panelas são vendidas, mas o que o texto destaca é o saber tradicional e a ligação com a natureza, não o consumo. Leia o que a fonte valoriza."
      E: "O texto cita várias etapas, mas feitas pelas mesmas mulheres, com saber passado em família. Especializar etapas é lógica de fábrica, oposta ao ofício descrito."
    aulas: []
