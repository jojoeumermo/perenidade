  - id: enem-2022-178
    area: matematica
    competencia: 2
    habilidade: 8
    objeto: mat-geometria
    topico: mat-geometria-esfera
    dificuldade: 2
    situacao: a-confirmar
    gabarito: E
    resolucao: |
      1. O volume da esfera depende do raio ao cubo. Dobrar o diâmetro (de 2 cm para 4 cm) multiplica o volume por 2³ = 8.
      2. Cada docinho grande gasta a massa de 8 pequenos. 150 grandes equivalem a 150 · 8 = 1 200 pequenos.
      3. Uma porção faz 50 pequenos: 1 200 ÷ 50 = 24 porções. Alternativa E.
    enganos:
      A: "2 não sai de uma conta natural com os dados. Compare os volumes: o docinho de 4 cm tem 8 vezes o volume do de 2 cm."
      B: "3 vem de 150 ÷ 50, sem considerar que o docinho ficou maior."
      C: "6 vem de 3 · 2: dobrou a massa porque dobrou o diâmetro. Volume cresce com o cubo da medida: 2³ = 8."
      D: "12 vem de 3 · 4: usou o quadrado (2² = 4), como se fosse área. Docinho maciço é volume: 2³ = 8."
    aulas: [matematica-medio/geometria-espacial]

  - id: enem-2022-179
