  - id: enem-2022-174
    area: matematica
    competencia: 2
    habilidade: 8
    objeto: mat-geometria
    topico: mat-geometria-esfera
    dificuldade: 2
    situacao: a-confirmar
    gabarito: D
    resolucao: |
      1. Volume do cilindro: π · 4² · 50 = 800π cm³.
      2. Esfera com diâmetro 1 cm tem raio 0,5 cm. Volume: (4/3) · π · 0,5³ = (4/3) · π · (1/8) = π/6 cm³.
      3. Número de esferas: 800π ÷ (π/6) = 800 · 6 = 4 800. Alternativa D.
    enganos:
      A: "800 vem de dividir 800π só por π, como se a esfera tivesse volume π. O volume da esfera de raio 0,5 é π/6."
      B: "1 200 vem de usar (4/3) · π · 0,5 = 2π/3, sem elevar o raio ao cubo."
      C: "2 400 vem de usar (4/3) · π · 0,5² = π/3, com o raio ao quadrado. No volume da esfera o raio vai ao cubo."
      E: "6 400 vem de usar π · 0,5³ = π/8, esquecendo o fator 4/3 da fórmula da esfera."
    aulas: [matematica-medio/geometria-espacial]

  - id: enem-2022-175
