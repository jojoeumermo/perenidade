  - id: enem-2022-180
    area: matematica
    competencia: 2
    habilidade: 6
    objeto: mat-geometria
    topico: mat-geometria-vistas-e-projecoes
    dificuldade: 3
    situacao: a-confirmar
    gabarito: E
    imagem: true
    resolucao: |
      A figura mostra o globo com dois caminhos destacados. No hemisfério norte: do polo N desce por um meridiano até o Equador, anda um quarto do Equador e sobe pelo outro meridiano até N. No hemisfério sul, do lado oposto: do polo S sobe por um meridiano até o Equador, anda um quarto do Equador e desce pelo outro meridiano até S. As alternativas mostram vistas de cima.
      1. Cada meridiano está num plano perpendicular ao plano α. Visto de cima, um arco de meridiano vira um segmento reto, do centro (polo) até a borda.
      2. O Equador é paralelo a α: visto de cima, continua sendo um arco de circunferência.
      3. Cada caminho vira, então, dois raios e um quarto de circunferência: um setor de um quarto de círculo.
      4. Os dois setores ficam em quadrantes opostos e se tocam no centro. Alternativa E.
    enganos:
      A: "A circunferência inteira com linhas curvas trata os meridianos como curvas vistas de cima. Meridiano em plano perpendicular a α se projeta como segmento reto."
      B: "Setores com lados curvos também trocam os meridianos por curvas. Vistos de cima, eles são raios retos."
      C: "Setores com lados curvos, de novo, não respeitam a projeção dos meridianos, que são segmentos retos ligando o centro à borda."
      D: "O círculo inteiro com a cruz seria a projeção dos dois meridianos completos e do Equador inteiro. Os caminhos destacados usam só um quarto do Equador em cada hemisfério."
    aulas: [matematica-medio/geometria-espacial]
