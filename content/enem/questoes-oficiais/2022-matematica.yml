  - id: enem-2022-176
    area: matematica
    competencia: 5
    habilidade: 22
    objeto: mat-algebra-geometria
    topico: mat-algebra-geometria-plano-cartesiano
    dificuldade: 3
    situacao: a-confirmar
    gabarito: D
    imagem: true
    resolucao: |
      A figura mostra, num plano cartesiano em km, a Cidade A em (20, 40), a Cidade B em (50, 20) e a Rodovia 003 sobre o eixo x. As localizações sugeridas para o ponto de conexão ficam no eixo x: I em 20, II em 30, III em 35, IV em 40 e V em 50.
      1. Truque do espelho: refletindo B no eixo x, temos B' = (50, −20). A distância até B é a mesma que até B'.
      2. O caminho mais curto de A até B' é a reta. Inclinação: (−20 − 40) ÷ (50 − 20) = −2. A reta corta o eixo x quando 0 = 40 − 2 · (x − 20), ou seja, x = 40. Esse é o ponto IV.
      3. Conferência com Pitágoras: em IV, √(20² + 40²) + √(10² + 20²) ≈ 44,72 + 22,36 = 67,08 km. Em III: 42,72 + 25 = 67,72. Em II: 41,23 + 28,28 ≈ 69,51. Em V: 50 + 20 = 70. Em I: 40 + 36,06 = 76,06.
      Alternativa D.
    enganos:
      A: "O ponto I fica bem abaixo da Cidade A: o trecho da 001 é o menor possível (40 km), mas o da 002 fica longo. Total: cerca de 76 km."
      B: "O ponto II não sai de uma conta natural. Dá cerca de 69,5 km, mais que os 67,1 km do ponto IV."
      C: "O ponto III (x = 35) é o meio entre 20 e 50. Como as cidades estão a alturas diferentes (40 e 20), o ponto ótimo fica mais perto da cidade mais baixa. III dá cerca de 67,7 km."
      E: "O ponto V fica bem abaixo da Cidade B: o trecho da 002 é o menor (20 km), mas o da 001 fica com 50 km. Total: 70 km."
    aulas: [matematica-medio/geometria-plana]

