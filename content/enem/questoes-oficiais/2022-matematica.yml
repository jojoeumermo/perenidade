    resolucao: |
      Todos os projetos têm 90 m³ (90 000 L). Revestimento = fundo + 4 paredes = c · l + 2 · p · (l + c), com p profundidade, l largura e c comprimento.
      I: 2 · 25 + 2 · 1,8 · 27 = 50 + 97,2 = 147,2 m².
      II: 5 · 9 + 2 · 2 · 14 = 45 + 56 = 101 m².
      III: 6 · 15 + 2 · 1 · 21 = 90 + 42 = 132 m².
      IV: 15 · 4 + 2 · 1,5 · 19 = 60 + 57 = 117 m².
      V: 3 · 12 + 2 · 2,5 · 15 = 36 + 75 = 111 m².
      A menor área é a do projeto II. Alternativa B.
    enganos:
      A: "O projeto I tem a maior área de revestimento (147,2 m²): é longo e estreito, com muita parede."
      C: "O projeto III tem as paredes de menor área (42 m²), mas o fundo de 90 m² pesa. É preciso somar fundo e paredes: 132 m²."
      D: "O projeto IV dá 117 m². Faça a soma completa de cada projeto antes de comparar."
      E: "O projeto V tem o menor fundo (36 m²), mas as paredes altas somam 75 m²: total 111 m², mais que os 101 m² do II."
