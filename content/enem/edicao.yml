# A edição corrente do Enem: datas e regras, cada uma com fonte oficial, item, trecho conferido e data da conferência.
# É o ÚNICO lugar do site com datas e regras da edição. As páginas leem daqui; as aulas citam um fato com
# {{enem:<id>}} no texto (por exemplo {{enem:aplicacao-dia-1}}), e a montagem troca pelo valor.
# Formato e validação: lib/enem.ts (validarEdicao). Atualização anual: docs/ENEM.md, seção "Todo ano".
#
# REGRAS
# - Só entra o que está numa fonte oficial (Inep, MEC, Diário Oficial). Notícia de jornal não conta.
# - "trecho" é a passagem conferida, copiada do ato oficial (atos oficiais não têm proteção de direito autoral,
#   Lei nº 9.610/1998, art. 8º, IV). Sem trecho, não entra.
# - Não confirmado: "situacao: confirmar-no-edital", sem "valor", com uma "nota" dizendo o que falta. O site mostra
#   "confirmar no edital" no lugar do valor.
# - Horários são sempre de Brasília (item 9.4 do edital).

