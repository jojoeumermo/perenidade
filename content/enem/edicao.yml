  # ── Na sala ──
  documentos-aceitos:
    afirmacao: "Documentos de identificação aceitos (brasileiros), sempre originais e com foto"
    tipo: lista
    valor:
      - "Carteira de identidade das Secretarias de Segurança Pública, das Forças Armadas, da Polícia Militar ou da Polícia Federal"
      - "Carteira de Identidade Nacional (CIN)"
      - "Identidade de ordem ou conselho de classe que valha por lei como documento de identidade"
      - "Passaporte"
      - "Carteira Nacional de Habilitação (no modelo da Lei nº 9.503/1997)"
      - "Carteira de Trabalho e Previdência Social emitida depois de 27 de janeiro de 1997"
      - "Documentos digitais com foto (e-Título, CNH e CIN) nos aplicativos oficiais ou no aplicativo gov.br"
    fonte: edital-64
    item: "10.1"
    trecho: "é obrigatória a apresentação de documento de identificação oficial e original com foto, emitido por órgãos brasileiros."
    conferido: "2026-10-30"
  documentos-recusados:
    afirmacao: "Documentos que NÃO valem"
    tipo: lista
    valor:
      - "Boletim de ocorrência e protocolos"
      - "Certidão de nascimento ou de casamento"
      - "Título de eleitor impresso"
      - "Carteira de estudante"
      - "Crachá e identidade funcional"
      - "Cópias, mesmo autenticadas"
      - "CNH no modelo anterior à Lei nº 9.503/1997"
    fonte: edital-64
    item: "10.4"
    trecho: "Não serão aceitos documentos de identificação que não estejam listados nos itens 10.1 e 10.2, como: boletim de ocorrência; protocolos; [...] Certidão de Nascimento; Certidão de Casamento; Título Eleitoral (versão impressa); [...] Carteira de Estudante"
    conferido: "2026-10-30"
  caneta:
    afirmacao: "Caneta permitida"
    tipo: texto
    valor: "caneta esferográfica de tinta preta, fabricada em material transparente"
    fonte: edital-64
    item: "11.1.30"
    trecho: "com caneta esferográfica de tinta preta, fabricada em material transparente"
    conferido: "2026-10-30"
  envelope-porta-objetos:
    afirmacao: "O que tem de ficar dentro do envelope porta-objetos (fora dele, elimina)"
    tipo: lista
    valor:
      - "Celular e qualquer aparelho eletrônico, desligados"
      - "Relógio de qualquer tipo"
      - "Calculadora, fone de ouvido, pen drive, alarme"
      - "Lápis, lapiseira, borracha, régua, corretivo e caneta que não seja transparente"
      - "Boné, chapéu, viseira, gorro e óculos escuros"
      - "Livros, apostilas, anotações e impressos, inclusive o Cartão de Confirmação e a Declaração de Comparecimento"
      - "Cigarro eletrônico e garrafa ou copo digital"
    fonte: edital-64
    item: "12.1.17"
    trecho: "Portar, fora do envelope porta-objetos fornecido pelo chefe de sala, ao iniciar as provas, Declaração de Comparecimento impressa, Cartão de Confirmação da Inscrição, bulas, óculos escuros e artigos de chapelaria [...] relógio de qualquer tipo e quaisquer dispositivos eletrônicos"
    conferido: "2026-10-30"
  saida-minima:
    afirmacao: "Tempo mínimo antes de poder sair em definitivo"
    tipo: minutos
    valor: 120
    fonte: edital-64
    item: "11.1.35"
    trecho: "Não se ausentar da sala de provas, em definitivo, antes de decorridas duas horas do início das provas."
    conferido: "2026-10-30"
  levar-caderno:
    afirmacao: "Quando se pode levar o Caderno de Questões"
    tipo: minutos
    valor: 30
    fonte: edital-64
    item: "11.1.34"
    trecho: "exceto o Caderno de Questões e a Folha de Rascunho, desde que, nesse caso, deixe a sala em definitivo nos últimos 30 (trinta) minutos que antecedem o término da prova."
    conferido: "2026-10-30"
  tres-ultimos:
    afirmacao: "Os três últimos participantes de cada sala"
    tipo: texto
    valor: "saem juntos, depois de assinar a Ata de Sala (menos nas salas de atendimento especializado)"
    fonte: edital-64
    item: "11.1.37"
    trecho: "Saírem juntos os três últimos participantes presentes na sala de provas somente após assinatura da Ata de Sala, exceto nas salas de atendimento especializado."
    conferido: "2026-10-30"
  rasura:
    afirmacao: "Respostas com rasura"
    tipo: texto
    valor: "só são corrigidas as respostas marcadas no Cartão-Resposta sem emendas ou rasuras, com a caneta preta transparente"
    fonte: edital-64
    item: "14.1"
    trecho: "Serão corrigidas somente as redações transcritas para a Folha de Redação e as respostas efetivamente marcadas no Cartão-Resposta, sem emendas ou rasuras"
    conferido: "2026-10-30"
  rascunho-nao-conta:
    afirmacao: "Rascunho e marcações no caderno"
    tipo: texto
    valor: "não são corrigidos"
    fonte: edital-64
    item: "14.2"
    trecho: "Os rascunhos e as marcações assinaladas nos Cadernos de Provas não serão corrigidos."
    conferido: "2026-10-30"

  # ── Redação ──
  redacao-linhas:
    afirmacao: "Tamanho máximo da redação"
    tipo: numero
    valor: 30
    fonte: noticia-cartilha
    trecho: "os participantes deverão produzir um texto dissertativo-argumentativo, com até 30 linhas"
    conferido: "2026-10-30"
  redacao-minimo:
    afirmacao: "Texto insuficiente (nota zero)"
    tipo: numero
    valor: 7
    fonte: edital-64
    item: "14.7.3"
    trecho: "Apresente até 7 (sete) linhas manuscritas, qualquer que seja o conteúdo, o que configurará \"Texto insuficiente\""
    conferido: "2026-10-30"
  redacao-nota:
    afirmacao: "Como a redação é corrigida"
    tipo: texto
    valor: "dois corretores independentes; cada um dá de 0 a 200 pontos em cada uma das 5 competências; a nota vai de 0 a 1.000"
    fonte: edital-64
    item: "14.4, 14.5 e 14.5.1"
    trecho: "A redação será corrigida por dois corretores de forma independente. Cada corretor atribuirá uma nota entre 0 (zero) e 200 (duzentos) pontos para cada uma das cinco competências."
    conferido: "2026-10-30"
  redacao-discrepancia:
    afirmacao: "Quando entra um terceiro corretor"
    tipo: texto
    valor: "quando as notas totais dos dois corretores diferem em mais de 100 pontos, ou em mais de 80 pontos numa competência"
    fonte: edital-64
    item: "14.5.3"
    trecho: "se suas notas totais diferirem por mais de 100 (cem) pontos; ou se a diferença de suas notas em qualquer uma das competências for superior a 80 (oitenta) pontos"
    conferido: "2026-10-30"
  redacao-zero:
    afirmacao: "O que zera a redação"
    tipo: lista
    valor:
