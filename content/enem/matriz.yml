  # ─────────────────────────────── NATUREZA ───────────────────────────────
  natureza:
    nome: "Ciências da Natureza e suas Tecnologias"
    sigla: CN
    dia: 2
    componentes: ["Física", "Química", "Biologia"]
    competencias:
      - numero: 1
        resumo: "Entender as ciências e as tecnologias como construções humanas ligadas à produção e à vida social."
        habilidades:
          - { numero: 1, resumo: "Reconhecer propriedades de ondas e oscilações e seus usos." }
          - { numero: 2, resumo: "Ligar soluções de problemas (comunicação, transporte, saúde) ao avanço científico e tecnológico." }
          - { numero: 3, resumo: "Comparar explicações científicas com as do senso comum, em épocas ou culturas diferentes." }
          - { numero: 4, resumo: "Avaliar propostas de intervenção no ambiente, pensando na vida humana e na biodiversidade." }
      - numero: 2
        resumo: "Reconhecer e usar as tecnologias ligadas às ciências em diferentes situações."
        habilidades:
          - { numero: 5, resumo: "Dimensionar circuitos e aparelhos elétricos do dia a dia." }
          - { numero: 6, resumo: "Entender manuais de instalação ou de uso de aparelhos e sistemas técnicos comuns." }
          - { numero: 7, resumo: "Escolher testes ou critérios para comparar materiais e produtos, defendendo consumidor, trabalhador e saúde." }
      - numero: 3
        resumo: "Ligar a degradação ou a conservação do ambiente a processos produtivos e sociais e a ações técnicas."
        habilidades:
          - { numero: 8, resumo: "Identificar etapas na obtenção, transformação, uso ou reciclagem de recursos naturais e energéticos." }
          - { numero: 9, resumo: "Entender a importância dos ciclos biogeoquímicos e do fluxo de energia, e o que os perturba." }
          - { numero: 10, resumo: "Analisar perturbações ambientais: origem, caminho e destino dos poluentes e seus efeitos." }
          - { numero: 11, resumo: "Reconhecer benefícios, limites e questões éticas da biotecnologia." }
          - { numero: 12, resumo: "Avaliar impactos de atividades sociais ou econômicas no ambiente, com interesses em conflito." }
      - numero: 4
        resumo: "Entender as relações entre os seres vivos e o ambiente, em especial as ligadas à saúde humana."
        habilidades:
          - { numero: 13, resumo: "Reconhecer como a vida se transmite e prever ou explicar características dos seres vivos." }
          - { numero: 14, resumo: "Identificar padrões nos processos vitais: equilíbrio interno, defesa, relação com o ambiente, sexualidade." }
          - { numero: 15, resumo: "Interpretar modelos e experimentos que explicam processos biológicos." }
          - { numero: 16, resumo: "Entender o papel da evolução nos padrões biológicos e na classificação dos seres vivos." }
      - numero: 5
        resumo: "Entender os métodos das ciências e aplicá-los em diferentes situações."
        habilidades:
          - { numero: 17, resumo: "Relacionar informações em texto, gráfico, tabela, fórmula ou símbolo usadas nas ciências." }
          - { numero: 18, resumo: "Relacionar propriedades de produtos e sistemas técnicos às finalidades a que servem." }
          - { numero: 19, resumo: "Avaliar métodos das ciências que ajudam a diagnosticar ou resolver problemas sociais, econômicos ou ambientais." }
      - numero: 6
        resumo: "Usar a física para interpretar, avaliar ou planejar intervenções em situações-problema."
        habilidades:
          - { numero: 20, resumo: "Explicar causas ou efeitos do movimento de partículas, objetos ou corpos celestes." }
          - { numero: 21, resumo: "Usar leis da física ou da química para interpretar processos térmicos ou eletromagnéticos." }
          - { numero: 22, resumo: "Entender a interação entre radiação e matéria e suas consequências." }
          - { numero: 23, resumo: "Avaliar formas de gerar, usar ou transformar energia, com suas implicações." }
      - numero: 7
        resumo: "Usar a química para interpretar, avaliar ou planejar intervenções em situações-problema."
        habilidades:
          - { numero: 24, resumo: "Usar a linguagem e a nomenclatura da química para descrever materiais e transformações." }
          - { numero: 25, resumo: "Caracterizar materiais e substâncias: etapas, rendimentos e impactos de sua produção." }
          - { numero: 26, resumo: "Avaliar impactos da produção e do consumo de recursos energéticos ou minerais." }
          - { numero: 27, resumo: "Avaliar propostas de intervenção no ambiente usando a química, pesando riscos e benefícios." }
      - numero: 8
        resumo: "Usar a biologia para interpretar, avaliar ou planejar intervenções em situações-problema."
        habilidades:
          - { numero: 28, resumo: "Ligar adaptações dos organismos ao modo de vida e ao lugar onde vivem, em especial no Brasil." }
          - { numero: 29, resumo: "Interpretar experimentos e técnicas com seres vivos e suas consequências." }
          - { numero: 30, resumo: "Avaliar propostas individuais ou coletivas de cuidado com a saúde e com o ambiente." }
