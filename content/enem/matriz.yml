# ─────────────────────────────── REDAÇÃO ───────────────────────────────
# As cinco competências, conferidas na Cartilha do Participante "A Redação do Enem 2026" (Inep, setembro de 2026).
# Cada uma vale de 0 a 200 pontos, por avaliador. Os níveis ficam em content/enem/redacao/grade.yml.
redacao:
  fonte:
    titulo: "A Redação do Enem 2026: Cartilha do Participante"
    autor: "Inep"
    url: "https://www.gov.br/inep/pt-br/centrais-de-conteudo/acervo-linha-editorial/publicacoes-institucionais/avaliacoes-e-exames-da-educacao-basica/a-redacao-do-enem-2026-cartilha-do-a-participante"
    conferido: "2026-10-30"
  competencias:
    - { numero: 1, resumo: "Escrever na modalidade formal da língua portuguesa (norma-padrão)." }
    - { numero: 2, resumo: "Entender a proposta e desenvolver o tema com conhecimentos de várias áreas, dentro da estrutura dissertativo-argumentativa em prosa." }
    - { numero: 3, resumo: "Escolher, relacionar, organizar e interpretar informações, fatos e opiniões para defender um ponto de vista." }
    - { numero: 4, resumo: "Usar os mecanismos da língua que ligam as partes do texto e constroem a argumentação (coesão)." }
    - { numero: 5, resumo: "Propor uma intervenção para o problema discutido, respeitando os direitos humanos." }
