  # ─────────────────────────────── HUMANAS ───────────────────────────────
  humanas:
    nome: "Ciências Humanas e suas Tecnologias"
    sigla: CH
    dia: 1
    componentes: ["História", "Geografia", "Filosofia", "Sociologia"]
    competencias:
      - numero: 1
        resumo: "Entender os elementos culturais que formam as identidades."
        habilidades:
          - { numero: 1, resumo: "Interpretar, pela história ou pela geografia, fontes sobre aspectos da cultura." }
          - { numero: 2, resumo: "Analisar como as sociedades produzem a memória." }
          - { numero: 3, resumo: "Ligar manifestações culturais de hoje aos seus processos históricos." }
          - { numero: 4, resumo: "Comparar pontos de vista de fontes diferentes sobre um aspecto da cultura." }
          - { numero: 5, resumo: "Identificar manifestações da diversidade do patrimônio cultural e artístico." }
      - numero: 2
        resumo: "Entender as mudanças do espaço geográfico como resultado de relações econômicas, culturais e de poder."
        habilidades:
          - { numero: 6, resumo: "Interpretar mapas, gráficos e outras representações do espaço." }
          - { numero: 7, resumo: "Identificar o sentido histórico e geográfico das relações de poder entre nações." }
          - { numero: 8, resumo: "Analisar a ação dos Estados sobre migrações e problemas econômicos e sociais." }
          - { numero: 9, resumo: "Comparar organizações políticas e econômicas em escala local, regional ou mundial." }
          - { numero: 10, resumo: "Reconhecer como os movimentos sociais se organizam e o papel da ação coletiva na mudança da realidade." }
      - numero: 3
        resumo: "Entender a origem e o papel das instituições sociais, políticas e econômicas, ligadas a grupos, conflitos e movimentos."
        habilidades:
          - { numero: 11, resumo: "Identificar registros das práticas de grupos sociais no tempo e no espaço." }
          - { numero: 12, resumo: "Analisar o papel da justiça como instituição na organização das sociedades." }
          - { numero: 13, resumo: "Analisar a ação de movimentos sociais em mudanças ou rupturas nas disputas pelo poder." }
          - { numero: 14, resumo: "Comparar interpretações diferentes sobre fatos ligados às instituições sociais, políticas e econômicas." }
          - { numero: 15, resumo: "Avaliar criticamente conflitos culturais, sociais, políticos, econômicos ou ambientais na história." }
      - numero: 4
        resumo: "Entender as mudanças técnicas e tecnológicas e seu impacto no trabalho, no conhecimento e na vida social."
        habilidades:
          - { numero: 16, resumo: "Identificar o papel das técnicas e tecnologias na organização do trabalho e da vida social." }
          - { numero: 17, resumo: "Analisar o impacto das novas tecnologias na localização da produção." }
          - { numero: 18, resumo: "Analisar formas de produzir e fazer circular riquezas e suas consequências no espaço e na sociedade." }
          - { numero: 19, resumo: "Reconhecer as mudanças técnicas que definem o uso dos espaços rural e urbano." }
          - { numero: 20, resumo: "Escolher argumentos a favor ou contra as mudanças que as novas tecnologias impõem à vida e ao trabalho." }
      - numero: 5
        resumo: "Usar a história para entender e valorizar a cidadania e a democracia."
        habilidades:
          - { numero: 21, resumo: "Identificar o papel dos meios de comunicação na vida social." }
          - { numero: 22, resumo: "Analisar lutas sociais e as conquistas que mudaram leis ou políticas públicas." }
          - { numero: 23, resumo: "Analisar a importância dos valores éticos na organização política das sociedades." }
          - { numero: 24, resumo: "Relacionar cidadania e democracia na organização das sociedades." }
          - { numero: 25, resumo: "Identificar estratégias de inclusão social." }
      - numero: 6
        resumo: "Entender as relações entre sociedade e natureza no espaço, em diferentes épocas e lugares."
        habilidades:
          - { numero: 26, resumo: "Identificar, em fontes diversas, como o espaço foi ocupado e a relação das pessoas com a paisagem." }
          - { numero: 27, resumo: "Analisar criticamente as relações entre sociedade e meio físico, pela história e pela geografia." }
          - { numero: 28, resumo: "Relacionar o uso de tecnologias aos impactos sociais e ambientais." }
          - { numero: 29, resumo: "Reconhecer o papel dos recursos naturais na produção do espaço e as mudanças causadas pela ação humana." }
          - { numero: 30, resumo: "Avaliar a relação entre preservação e destruição da vida no planeta, em várias escalas." }
