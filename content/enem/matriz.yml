# A Matriz de Referência do Enem, do jeito que o curso usa: áreas, competências de área, habilidades (H1 a H30 em
# cada área), objetos de conhecimento do anexo da Matriz e as cinco competências da redação.
# Formato e validação: lib/enem.ts (validarMatriz). Documentação: docs/ENEM.md.
#
# REGRAS
# - Os números das competências e das habilidades são os oficiais. O "resumo" é uma frase da equipe para orientar o
#   estudo; NÃO é a redação oficial (que está no documento do Inep, na fonte abaixo).
# - Os "objetos" são os do anexo da Matriz ("Objetos de conhecimento associados às Matrizes de Referência"), com o
#   nome oficial curto. A lista de "habilidades" de cada objeto é proposta da equipe (o anexo não liga objeto a
#   habilidade): por isso fica "situacao: a-confirmar" até um educador da área conferir.
# - Os "topicos" quebram cada objeto nas aulas do percurso. O id de um tópico começa sempre pelo id do objeto
#   (mat-numeros → mat-numeros-porcentagem). Ids nunca mudam depois de publicados: exercícios e questões apontam
#   para eles.
# - Objeto com "anexo: false" não está no anexo oficial; foi criado pela equipe para uma competência que o anexo
#   não detalha (caso da língua estrangeira).

fonte:
  titulo: "Matriz de Referência Enem"
  autor: "Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (Inep)"
  url: "https://download.inep.gov.br/download/enem/matriz_referencia.pdf"
  pagina: "https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/outros-documentos"
  citada_em: "Edital nº 64, de 21 de maio de 2026, item 3.1"
  conferido: "2026-10-30"

eixos:
  - { sigla: DL, resumo: "Dominar linguagens: a norma-padrão do português e as linguagens da matemática, das artes, das ciências e das línguas estrangeiras." }
  - { sigla: CF, resumo: "Compreender fenômenos: usar conceitos das várias áreas para entender a natureza, a história, a geografia, a técnica e a arte." }
  - { sigla: SP, resumo: "Enfrentar situações-problema: escolher, organizar e interpretar dados para decidir." }
  - { sigla: CA, resumo: "Construir argumentação: juntar informações e conhecimentos para defender uma posição de forma consistente." }
  - { sigla: EP, resumo: "Elaborar propostas: usar o que se aprendeu para propor intervenções solidárias na realidade, respeitando os direitos humanos e a diversidade." }

areas:
  # ─────────────────────────────── LINGUAGENS ───────────────────────────────
  linguagens:
    nome: "Linguagens, Códigos e suas Tecnologias"
    sigla: LC
    dia: 1
    componentes: ["Língua Portuguesa", "Literatura", "Língua Estrangeira (Inglês ou Espanhol)", "Artes", "Educação Física", "Tecnologias da Informação e Comunicação"]
    competencias:
      - numero: 1
        resumo: "Usar as tecnologias da comunicação e da informação na escola, no trabalho e na vida."
        habilidades:
          - { numero: 1, resumo: "Reconhecer as diferentes linguagens e os recursos expressivos de cada meio de comunicação." }
          - { numero: 2, resumo: "Usar o que se sabe sobre os meios de comunicação para resolver problemas sociais." }
          - { numero: 3, resumo: "Relacionar as informações dos meios de comunicação à função social que eles têm." }
          - { numero: 4, resumo: "Reconhecer críticas aos usos sociais das linguagens e dos meios de comunicação." }
      - numero: 2
        resumo: "Ler em língua estrangeira (inglês ou espanhol) para chegar a informações e a outras culturas."
        habilidades:
          - { numero: 5, resumo: "Ligar palavras e expressões de um texto em língua estrangeira ao tema dele." }
          - { numero: 6, resumo: "Usar a língua estrangeira para ampliar o acesso a informações, tecnologias e culturas." }
          - { numero: 7, resumo: "Relacionar um texto em língua estrangeira às suas estruturas, à sua função e ao seu uso social." }
          - { numero: 8, resumo: "Reconhecer a produção cultural em língua estrangeira como parte da diversidade de culturas e línguas." }
      - numero: 3
        resumo: "Entender a linguagem do corpo como parte da vida, da convivência e da identidade."
        habilidades:
          - { numero: 9, resumo: "Reconhecer que as práticas corporais nascem de necessidades do dia a dia de cada grupo social." }
          - { numero: 10, resumo: "Reconhecer quando é preciso mudar hábitos corporais por causa das necessidades do corpo em movimento." }
          - { numero: 11, resumo: "Reconhecer o corpo como meio de convivência, respeitando limites e adaptações para cada pessoa." }
      - numero: 4
        resumo: "Entender a arte como saber cultural e estético que dá sentido ao mundo e à identidade."
        habilidades:
          - { numero: 12, resumo: "Reconhecer as funções da arte e o trabalho dos artistas no meio em que vivem." }
          - { numero: 13, resumo: "Analisar obras de arte como forma de explicar culturas, padrões de beleza e preconceitos." }
          - { numero: 14, resumo: "Valorizar a diversidade artística e as trocas entre as manifestações de diferentes grupos sociais e étnicos." }
      - numero: 5
        resumo: "Analisar e interpretar os recursos das linguagens, ligando cada texto ao seu contexto de produção e de leitura."
        habilidades:
          - { numero: 15, resumo: "Relacionar o texto literário ao momento histórico, social e político em que foi escrito." }
          - { numero: 16, resumo: "Relacionar a concepção artística de um autor ou movimento ao modo como o texto literário é construído." }
          - { numero: 17, resumo: "Reconhecer na literatura brasileira valores sociais e humanos que continuam atuais." }
      - numero: 6
        resumo: "Usar os sistemas de símbolos das linguagens para organizar o pensamento, comunicar e informar."
        habilidades:
          - { numero: 18, resumo: "Identificar o que faz o tema de um texto avançar e como ele se organiza, em vários gêneros e tipos." }
          - { numero: 19, resumo: "Analisar a função da linguagem que predomina num texto, em cada situação de comunicação." }
          - { numero: 20, resumo: "Reconhecer o patrimônio linguístico como parte da memória e da identidade do país." }
      - numero: 7
        resumo: "Confrontar opiniões e pontos de vista sobre as linguagens e suas manifestações."
        habilidades:
          - { numero: 21, resumo: "Reconhecer recursos verbais e não verbais usados para criar ou mudar comportamentos." }
          - { numero: 22, resumo: "Relacionar opiniões, temas, assuntos e recursos linguísticos em textos diferentes." }
          - { numero: 23, resumo: "Inferir o objetivo de quem escreveu e o público a quem o texto se dirige, pelos argumentos usados." }
          - { numero: 24, resumo: "Reconhecer estratégias para convencer o público, como intimidação, sedução, comoção ou chantagem." }
      - numero: 8
        resumo: "Usar a língua portuguesa como língua materna, que dá sentido ao mundo e à identidade."
        habilidades:
          - { numero: 25, resumo: "Identificar as marcas das variedades linguísticas sociais, regionais e de registro." }
          - { numero: 26, resumo: "Relacionar cada variedade linguística à situação de uso em que ela aparece." }
          - { numero: 27, resumo: "Reconhecer os usos da norma-padrão nas diferentes situações de comunicação." }
      - numero: 9
        resumo: "Entender a natureza e o impacto das tecnologias da comunicação e da informação na vida pessoal e social."
        habilidades:
          - { numero: 28, resumo: "Reconhecer a função e o impacto social das tecnologias da comunicação e da informação." }
          - { numero: 29, resumo: "Identificar as tecnologias da comunicação pela análise das linguagens que elas usam." }
          - { numero: 30, resumo: "Relacionar as tecnologias da comunicação ao desenvolvimento das sociedades e ao conhecimento que elas produzem." }
    objetos:
      - id: lin-texto
        nome: "Estudo do texto"
        resumo: "Sequências e gêneros textuais, modos de organizar um texto, leitura e escrita nas esferas pública e privada."
        habilidades: [18, 19, 21, 22, 23]
        situacao: a-confirmar
        topicos:
          - { id: lin-texto-estrategias-de-leitura, nome: "Estratégias de leitura e inferência" }
          - { id: lin-texto-tipos-textuais, nome: "Tipos textuais: narrar, descrever, expor, argumentar, instruir" }
          - { id: lin-texto-funcoes-da-linguagem, nome: "Funções da linguagem" }
          - { id: lin-texto-generos-jornalisticos, nome: "Gêneros jornalísticos: notícia e reportagem" }
          - { id: lin-texto-generos-opinativos, nome: "Artigo de opinião, editorial, carta aberta e resenha" }
          - { id: lin-texto-cronica-e-conto, nome: "Crônica e conto" }
          - { id: lin-texto-humor-grafico, nome: "Charge, tirinha, cartum e meme" }
          - { id: lin-texto-generos-do-cotidiano, nome: "Verbete, manual, receita, anúncio e campanha" }
          - { id: lin-texto-infografico, nome: "Infográfico e texto multimodal" }
      - id: lin-praticas-corporais
        nome: "Estudo das práticas corporais"
        resumo: "O corpo como linguagem: esporte, dança, lutas, jogos, brincadeiras, saúde, lazer e identidade."
        habilidades: [9, 10, 11]
        situacao: a-confirmar
        topicos:
          - { id: lin-praticas-corporais-sociedade, nome: "Práticas corporais, cultura e sociedade" }
          - { id: lin-praticas-corporais-saude-e-beleza, nome: "Corpo, saúde e padrões de beleza" }
          - { id: lin-praticas-corporais-lutas-dancas-ginasticas, nome: "Lutas, danças e ginásticas" }
          - { id: lin-praticas-corporais-jogos-e-brincadeiras, nome: "Jogos e brincadeiras" }
          - { id: lin-praticas-corporais-esporte-midia, nome: "Esporte, mídia e mercado" }
      - id: lin-artes
        nome: "Produção e recepção de textos artísticos"
        resumo: "Artes visuais, teatro, música e dança: forma, contexto, comunidade, diversidade e patrimônio."
        habilidades: [12, 13, 14]
        situacao: a-confirmar
        topicos:
          - { id: lin-artes-arte-como-linguagem, nome: "Arte como linguagem e patrimônio" }
          - { id: lin-artes-indigena-e-afro, nome: "Arte indígena e afro-brasileira" }
          - { id: lin-artes-barroco-mineiro, nome: "Barroco mineiro" }
          - { id: lin-artes-modernismo, nome: "Modernismo nas artes visuais" }
          - { id: lin-artes-contemporanea-e-urbana, nome: "Arte contemporânea e arte urbana" }
          - { id: lin-artes-musica-brasileira, nome: "Música brasileira e as culturas que a criaram" }
          - { id: lin-artes-teatro-danca-cinema-foto, nome: "Teatro, dança, cinema e fotografia" }
          - { id: lin-artes-cultura-popular, nome: "Cultura popular e patrimônio imaterial" }
      - id: lin-literatura
        nome: "Estudo do texto literário"
        resumo: "Literatura e processo social, movimentos literários, gêneros e a formação do patrimônio literário nacional."
        habilidades: [15, 16, 17]
        situacao: a-confirmar
        topicos:
          - { id: lin-literatura-texto-literario, nome: "O texto literário e os gêneros literários" }
          - { id: lin-literatura-quinhentismo, nome: "Quinhentismo e literatura de informação" }
          - { id: lin-literatura-barroco, nome: "Barroco" }
          - { id: lin-literatura-arcadismo, nome: "Arcadismo" }
          - { id: lin-literatura-romantismo, nome: "Romantismo" }
          - { id: lin-literatura-realismo-naturalismo, nome: "Realismo e Naturalismo" }
          - { id: lin-literatura-parnasianismo-simbolismo, nome: "Parnasianismo e Simbolismo" }
          - { id: lin-literatura-pre-modernismo, nome: "Pré-Modernismo" }
          - { id: lin-literatura-semana-de-22, nome: "Vanguardas europeias e Semana de 1922" }
          - { id: lin-literatura-primeira-geracao-modernista, nome: "Primeira geração modernista" }
          - { id: lin-literatura-geracao-de-30, nome: "Romance de 30 e poesia de 30" }
          - { id: lin-literatura-geracao-de-45, nome: "Geração de 45" }
          - { id: lin-literatura-contemporanea, nome: "Poesia concreta e produção contemporânea" }
          - { id: lin-literatura-afro-brasileira, nome: "Literatura afro-brasileira" }
          - { id: lin-literatura-indigena, nome: "Literatura indígena" }
          - { id: lin-literatura-cordel-e-oralidade, nome: "Cordel e literatura oral" }
          - { id: lin-literatura-marginal-e-periferica, nome: "Literatura marginal e periférica" }
      - id: lin-recursos-expressivos
        nome: "Estudo dos aspectos linguísticos em diferentes textos"
        resumo: "Recursos expressivos da língua e a articulação entre ideias (relações lógico-semânticas)."
        habilidades: [18, 22]
        situacao: a-confirmar
        topicos:
          - { id: lin-recursos-expressivos-coesao-e-coerencia, nome: "Coesão e coerência" }
          - { id: lin-recursos-expressivos-intertextualidade, nome: "Intertextualidade: paródia, paráfrase, citação, alusão" }
          - { id: lin-recursos-expressivos-figuras, nome: "Figuras de linguagem" }
          - { id: lin-recursos-expressivos-semantica, nome: "Semântica: polissemia, ambiguidade, denotação e conotação" }
      - id: lin-argumentacao
        nome: "Estudo do texto argumentativo, seus gêneros e recursos linguísticos"
        resumo: "Pontos de vista, progressão do texto, papéis dos interlocutores e propósitos de quem escreve."
        habilidades: [21, 22, 23, 24]
        situacao: a-confirmar
        topicos:
          - { id: lin-argumentacao-tema-tese-argumento, nome: "Tema, tese e argumento" }
          - { id: lin-argumentacao-estrategias, nome: "Estratégias argumentativas" }
          - { id: lin-argumentacao-publicidade, nome: "Persuasão na publicidade e na propaganda" }
      - id: lin-lingua-portuguesa
        nome: "Estudo dos aspectos linguísticos da língua portuguesa"
        resumo: "Norma-padrão e variação linguística, registro, formalidade, escolha de palavras, tempos verbais e coesão."
        habilidades: [20, 25, 26, 27]
        situacao: a-confirmar
        topicos:
          - { id: lin-lingua-portuguesa-variacao, nome: "Variação linguística" }
          - { id: lin-lingua-portuguesa-preconceito-linguistico, nome: "Preconceito linguístico" }
          - { id: lin-lingua-portuguesa-norma-padrao, nome: "Norma-padrão em uso: concordância, regência, crase, pontuação, colocação" }
          - { id: lin-lingua-portuguesa-formacao-de-palavras, nome: "Formação de palavras" }
          - { id: lin-lingua-portuguesa-oralidade-e-escrita, nome: "Oralidade e escrita" }
          - { id: lin-lingua-portuguesa-portugues-no-brasil, nome: "O português no Brasil e as línguas indígenas e africanas" }
      - id: lin-generos-digitais
        nome: "Estudo dos gêneros digitais"
        resumo: "Tecnologias da comunicação e informação: suportes, interlocutores, linguagem e função social."
        habilidades: [1, 2, 3, 4, 28, 29, 30]
        situacao: a-confirmar
        topicos:
          - { id: lin-generos-digitais-hipertexto, nome: "Internet, hipertexto e redes sociais" }
          - { id: lin-generos-digitais-algoritmos, nome: "Algoritmos e bolhas" }
          - { id: lin-generos-digitais-desinformacao, nome: "Desinformação e checagem" }
          - { id: lin-generos-digitais-privacidade, nome: "Privacidade e dados" }
      - id: lin-lem
        nome: "Leitura em língua estrangeira (inglês ou espanhol)"
        resumo: "Leitura de textos em inglês ou espanhol: vocabulário em contexto, gêneros, cognatos e falsos cognatos."
        anexo: false
        habilidades: [5, 6, 7, 8]
        situacao: a-confirmar
        topicos:
          - { id: lin-lem-ingles-estrategias, nome: "Inglês: estratégias de leitura (cognatos, skimming, scanning, inferência)" }
          - { id: lin-lem-ingles-generos, nome: "Inglês: gêneros mais frequentes e vocabulário em contexto" }
          - { id: lin-lem-ingles-conectivos, nome: "Inglês: conectivos e marcadores do texto" }
          - { id: lin-lem-espanhol-estrategias, nome: "Espanhol: estratégias de leitura e falsos cognatos (heterosemánticos)" }
          - { id: lin-lem-espanhol-generos, nome: "Espanhol: gêneros mais frequentes e vocabulário em contexto" }
          - { id: lin-lem-espanhol-conectivos, nome: "Espanhol: conectivos e marcadores do texto" }

  # ─────────────────────────────── MATEMÁTICA ───────────────────────────────
  matematica:
    nome: "Matemática e suas Tecnologias"
    sigla: MT
    dia: 2
    componentes: ["Matemática"]
    competencias:
      - numero: 1
        resumo: "Entender o sentido dos números naturais, inteiros, racionais e reais."
        habilidades:
          - { numero: 1, resumo: "Reconhecer, em situações sociais, os significados e as formas de escrever números e operações." }
          - { numero: 2, resumo: "Identificar padrões numéricos ou princípios de contagem." }
          - { numero: 3, resumo: "Resolver problemas com conhecimentos numéricos." }
          - { numero: 4, resumo: "Julgar se um resultado numérico faz sentido ao discutir uma afirmação com números." }
          - { numero: 5, resumo: "Avaliar propostas de intervenção na realidade usando conhecimentos numéricos." }
      - numero: 2
        resumo: "Usar a geometria para ler, representar e agir sobre a realidade."
        habilidades:
          - { numero: 6, resumo: "Interpretar posição e movimento no espaço e sua representação no plano (mapas, vistas, plantas)." }
          - { numero: 7, resumo: "Identificar características de figuras planas e espaciais." }
          - { numero: 8, resumo: "Resolver problemas de geometria de espaço e forma." }
          - { numero: 9, resumo: "Usar a geometria para escolher argumentos que resolvem problemas do cotidiano." }
      - numero: 3
        resumo: "Entender grandezas e medidas para resolver problemas do cotidiano."
        habilidades:
          - { numero: 10, resumo: "Identificar relações entre grandezas e unidades de medida." }
          - { numero: 11, resumo: "Usar escalas para ler representações do cotidiano." }
          - { numero: 12, resumo: "Resolver problemas com medidas de grandezas." }
          - { numero: 13, resumo: "Avaliar o resultado de uma medição ao construir um argumento." }
          - { numero: 14, resumo: "Avaliar propostas de intervenção usando grandezas e medidas." }
      - numero: 4
        resumo: "Entender como as grandezas variam juntas, para resolver problemas do cotidiano."
        habilidades:
          - { numero: 15, resumo: "Identificar quando uma grandeza depende de outra." }
          - { numero: 16, resumo: "Resolver problemas com grandezas direta ou inversamente proporcionais." }
          - { numero: 17, resumo: "Analisar a variação de grandezas para construir argumentos." }
          - { numero: 18, resumo: "Avaliar propostas de intervenção que envolvem variação de grandezas." }
      - numero: 5
        resumo: "Modelar e resolver problemas sociais, econômicos, técnicos ou científicos com álgebra."
        habilidades:
          - { numero: 19, resumo: "Identificar a expressão algébrica que traduz a relação entre grandezas." }
          - { numero: 20, resumo: "Interpretar gráficos cartesianos que relacionam grandezas." }
          - { numero: 21, resumo: "Resolver problemas cuja modelagem pede álgebra." }
          - { numero: 22, resumo: "Usar álgebra e geometria para construir argumentos." }
          - { numero: 23, resumo: "Avaliar propostas de intervenção usando álgebra." }
      - numero: 6
        resumo: "Ler gráficos e tabelas de natureza científica e social para prever, estimar e interpretar."
        habilidades:
          - { numero: 24, resumo: "Fazer inferências a partir de gráficos ou tabelas." }
          - { numero: 25, resumo: "Resolver problemas com dados de tabelas ou gráficos." }
          - { numero: 26, resumo: "Analisar gráficos ou tabelas para construir argumentos." }
      - numero: 7
        resumo: "Entender o acaso e usar estatística e probabilidade para interpretar dados."
        habilidades:
          - { numero: 27, resumo: "Calcular médias, moda, mediana ou dispersão de dados em tabelas de frequência ou gráficos." }
          - { numero: 28, resumo: "Resolver problemas de estatística e probabilidade." }
          - { numero: 29, resumo: "Usar estatística e probabilidade para construir argumentos." }
          - { numero: 30, resumo: "Avaliar propostas de intervenção usando estatística e probabilidade." }
    objetos:
      - id: mat-numeros
        nome: "Conhecimentos numéricos"
        resumo: "Operações nos conjuntos numéricos, divisibilidade, razões, proporções, porcentagem, juros, sequências e contagem."
        habilidades: [1, 2, 3, 4, 5, 15, 16, 17, 18]
        situacao: a-confirmar
        topicos:
          - { id: mat-numeros-operacoes, nome: "Operações com inteiros e racionais" }
          - { id: mat-numeros-fracoes-e-decimais, nome: "Frações e decimais" }
          - { id: mat-numeros-potencias-e-notacao-cientifica, nome: "Potências, raízes e notação científica" }
          - { id: mat-numeros-multiplos-e-divisores, nome: "Múltiplos, divisores, MMC e MDC" }
          - { id: mat-numeros-expressoes, nome: "Expressões numéricas" }
          - { id: mat-numeros-estimativa, nome: "Arredondamento e estimativa" }
          - { id: mat-numeros-razao-e-proporcao, nome: "Razão e proporção" }
          - { id: mat-numeros-grandezas-proporcionais, nome: "Grandezas direta e inversamente proporcionais" }
          - { id: mat-numeros-regra-de-tres, nome: "Regra de três simples e composta" }
          - { id: mat-numeros-porcentagem, nome: "Porcentagem" }
          - { id: mat-numeros-aumentos-e-descontos, nome: "Aumentos e descontos sucessivos" }
          - { id: mat-numeros-juros-simples, nome: "Juros simples" }
          - { id: mat-numeros-juros-compostos, nome: "Juros compostos" }
          - { id: mat-numeros-inflacao, nome: "Inflação e poder de compra" }
          - { id: mat-numeros-contas-do-dia-a-dia, nome: "Contas do dia a dia: luz, água, salário, parcelamento, impostos" }
          - { id: mat-numeros-taxas, nome: "Velocidade, vazão, densidade e outras taxas" }
