<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Papel de parede no estilo do Kali Linux: fundo escuro azulado, raios geométricos finos e um dragão à direita. -->
  <defs>
    <radialGradient id="bg" cx="62%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0e2a3a"/>
      <stop offset="42%" stop-color="#0a1824"/>
      <stop offset="100%" stop-color="#050a10"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1aa3d8" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#1aa3d8" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Raios finos saindo de um ponto à direita, como as linhas de luz do papel do Kali. -->
  <g stroke="#2b7fa8" stroke-width="1" opacity="0.18" fill="none">
    <path d="M1180 300 L100 90"/>
    <path d="M1180 300 L80 300"/>
    <path d="M1180 300 L120 560"/>
    <path d="M1180 300 L260 820"/>
    <path d="M1180 300 L620 880"/>
    <path d="M1180 300 L1040 895"/>
    <path d="M1180 300 L1520 760"/>
    <path d="M1180 300 L1580 360"/>
    <path d="M1180 300 L1500 40"/>
    <path d="M1180 300 L760 20"/>
  </g>
  <g stroke="#7fe3ff" stroke-width="1.5" opacity="0.10" fill="none">
    <circle cx="1180" cy="300" r="150"/>
    <circle cx="1180" cy="300" r="300"/>
    <circle cx="1180" cy="300" r="470"/>
  </g>
  <!-- Dragão estilizado (evoca o símbolo do Kali, sem copiar o logotipo), branco bem apagado. -->
  <g transform="translate(905,150) scale(5.6)" fill="#eaf6ff" opacity="0.07">
    <path d="M3 7c2.3-1.1 4.6-1 6.8.3 1 .6 1.9 1.4 2.6 2.4.5-1.2 1.4-2.2 2.7-2.7-.4 1-.4 2 .1 3 .9 1.7.8 3.6-.3 5.2-.9 1.3-2.2 2.1-3.8 2.4l.9 1.8-2.4-.7-1.1 1.6-.5-1.9-2.2.2 1.3-1.6C5 17.9 4 16.4 3.7 14.6c-.3-1.7.2-3.3 1.4-4.6C4 9.4 3.3 8.3 3 7z"/>
  </g>
  <rect width="1600" height="900" fill="url(#fade)"/>
</svg>
