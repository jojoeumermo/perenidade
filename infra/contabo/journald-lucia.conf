#
# O prazo do registro do sistema (journald) na VPS: o mesmo do registro do site no Caddy (7 dias). Vai para
# /etc/systemd/journald.conf.d/90-lucia.conf (infra/contabo/instalar.sh copia). Sem ele, o journald guarda até encher 10% do
# disco, sem prazo. O que entra lá já sai sem endereço de rede nem cabeçalho (o filtro do Caddy); o prazo é a segunda barreira.
[Journal]
MaxRetentionSec=7day
SystemMaxUse=500M
