#
# O chat privado da Alumia como serviço onion (docs/rede/ONION.md). Vai no fim de /etc/tor/torrc da VPS (apt-get install tor).
# A chave do serviço nasce na VPS (/var/lib/tor/lucia-conversas/) e nunca sai dela; o endereço .onion vem dessa chave.
# O Caddy (infra/contabo/Caddyfile, bloco "http://:8090") escuta só em 127.0.0.1:8090.
HiddenServiceDir /var/lib/tor/lucia-conversas/
HiddenServicePort 80 127.0.0.1:8090
