name: Sentinela — instalador Windows

# Monta o app de mesa do Sentinela Lúcia (Tauri) e publica o instalador (.exe NSIS e .msi) como artefato da rodada.
# Roda à mão (Actions → Sentinela — instalador Windows → Run workflow) ou quando sai uma etiqueta "sentinela-v*".
# Os endereços do serviço do Sentinela são embutidos a partir das variáveis do repositório (Settings → Secrets and
# variables → Actions → Variables): SENTINELA_SUPABASE_URL, SENTINELA_ANON_KEY (pública) e SENTINELA_WORKER_URL.
# Sem elas, o instalador sai igual e a pessoa cola os endereços na primeira abertura.
on:
  workflow_dispatch:
  push:
    tags: ["sentinela-v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sentinela
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sentinela/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinela/src-tauri
      - run: npm ci
      - run: npm run testar
      - name: Montar o instalador
        env:
          VITE_SENTINELA_SUPABASE_URL: ${{ vars.SENTINELA_SUPABASE_URL }}
          VITE_SENTINELA_ANON_KEY: ${{ vars.SENTINELA_ANON_KEY }}
          VITE_SENTINELA_WORKER_URL: ${{ vars.SENTINELA_WORKER_URL }}
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sentinela-lucia-windows
          path: |
            sentinela/src-tauri/target/release/bundle/nsis/*.exe
            sentinela/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
