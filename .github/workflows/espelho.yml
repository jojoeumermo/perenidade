name: Espelho de leitura

# Uma vez por mês (e quando alguém mandar), gera o espelho estático das aulas e do acervo (scripts/gerar-espelho.mjs)
# e guarda o .zip como artefato por 90 dias. Se o site for derrubado, é esse pacote que sobe noutro lugar
# (docs/ESPELHO-E-COPIAS.md). Só instala o necessário, para gastar poucos minutos do GitHub Actions.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  espelho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/gerar-espelho.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: espelho-instituto-lucia
          path: espelho.zip
          retention-days: 90
