name: Espelho de leitura

# Uma vez por mês (e quando alguém mandar), gera o espelho estático das aulas e do acervo (scripts/gerar-espelho.mjs)
# e guarda o .zip como artefato por 90 dias. Se o site for derrubado, é esse pacote que sobe noutro lugar
# (docs/ESPELHO-E-COPIAS.md). Só instala o necessário, para gastar poucos minutos do GitHub Actions.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  espelho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/gerar-espelho.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: espelho-instituto-lucia
          path: espelho.zip
          retention-days: 90
