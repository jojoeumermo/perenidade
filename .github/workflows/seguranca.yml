name: Segurança

# Segredos no código e dependências com falha conhecida. Roda quando o código muda (envio ou pedido de junção) e toda
# semana no histórico inteiro, aulas incluídas (falhas novas aparecem em pacotes que já estavam aqui). Aula, matéria e
# documentação não disparam a cada envio: eram mais de cem rodadas por mês e esgotaram os minutos do GitHub.
# O GitHub não oferece a varredura de segredos neste plano: o gitleaks faz o papel dela, no histórico inteiro.
# As duas ferramentas vêm das páginas oficiais, com o resumo SHA-256 conferido.
on:
  push:
    branches: [master]
    paths-ignore:
      - "content/**"
      - "docs/**"
      - "historico/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "content/**"
      - "docs/**"
      - "historico/**"
      - "*.md"
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.30.1 (histórico inteiro)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --config .gitleaks.toml --exit-code 1

  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: osv-scanner 2.7.0 (falha com gravidade alta ou crítica)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile package-lock.json --format table || true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # O npm audit só lê o package-lock (não instala nada) e falha com gravidade alta ou crítica.
      - run: npm audit --audit-level=high --package-lock-only
