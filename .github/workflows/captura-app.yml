name: Captura do app (temporário, PR #65)

# TEMPORÁRIO: tira capturas de tela do app instalado e do site (celular e computador) para conferir os pixels antes de
# publicar. Sai do ramo por commit próprio antes do master. Mesma base do ponta-a-ponta.yml: Chrome do runner, banco de
# teste local em memória (npm run dev:local), sem segredo, sem deploy, contents:read. As capturas viram um artefato por
# 3 dias, só com telas do site de teste (nenhum dado pessoal).
on:
  pull_request:
    paths:
      - ".github/workflows/captura-app.yml"
      - "e2e/app-captura.spec.ts"

concurrency:
  group: captura-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rotulo: app
            grupo: tudo
            ref: ""
          - rotulo: base
            grupo: site
            ref: 6c4ccc0d36fb807620cab2c876a2204ed646ba98
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ matrix.ref }}
      - name: Spec de captura do ramo do PR (o ramo-base não a tem)
        if: matrix.ref != ''
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git checkout "${{ github.event.pull_request.head.sha }}" -- e2e/app-captura.spec.ts
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Capturas
        run: npx playwright test e2e/app-captura --project=computador
        env:
          CI: "1"
          CAPTURA_ROTULO: ${{ matrix.rotulo }}
          CAPTURA_GRUPO: ${{ matrix.grupo }}
          ALUMIA_VOTO_SEGREDO: "segredo-so-de-teste-do-e2e-0123456789abcdef"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: capturas-${{ matrix.rotulo }}
          path: test-results/capturas/
          retention-days: 3
          if-no-files-found: warn
