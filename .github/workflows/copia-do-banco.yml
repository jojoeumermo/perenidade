name: Cópia do banco

# Uma cópia cifrada do banco de produção, toda segunda-feira, guardada 30 dias como artefato do repositório.
# Fica desligada até a coordenação pôr dois segredos no GitHub (Settings › Secrets and variables › Actions):
#   SUPABASE_DB_URL  a "Connection string" do Supabase (Project Settings › Database › URI, modo Session)
#   COPIA_SENHA      uma frase longa só para esta cópia; sem ela ninguém abre o arquivo
# O passo a passo de restaurar está em docs/ESPELHO-E-COPIAS.md. O arquivo tem dados pessoais: por isso sai cifrado.
# Artefato de repositório público qualquer conta do GitHub baixa: com o repositório público a rotina não roda.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copia:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      COPIA_SENHA: ${{ secrets.COPIA_SENHA }}
    steps:
      - name: Confere se a cópia foi ligada
        id: ligada
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$COPIA_SENHA" ]; then
            echo "Cópia desligada: faltam os segredos SUPABASE_DB_URL e COPIA_SENHA." >> "$GITHUB_STEP_SUMMARY"
            echo "sim=nao" >> "$GITHUB_OUTPUT"
          else
            echo "sim=sim" >> "$GITHUB_OUTPUT"
          fi
      - name: Instala o pg_dump 17
        if: steps.ligada.outputs.sim == 'sim'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Copia e cifra
        if: steps.ligada.outputs.sim == 'sim'
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --schema=interno --schema=public --schema=auth --file=banco.dump
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$COPIA_SENHA" --output "banco-$(date +%F).dump.gpg" banco.dump
          rm banco.dump
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.ligada.outputs.sim == 'sim'
        with:
          name: copia-do-banco
          path: banco-*.dump.gpg
          retention-days: 30
