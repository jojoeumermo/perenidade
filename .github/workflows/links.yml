name: Links do acervo

# Toda segunda-feira confere se as fontes do acervo ainda respondem.
# Se alguma cair, a execução falha e o GitHub avisa por e-mail.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:links
