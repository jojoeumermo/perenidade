name: Links do acervo

# Toda segunda-feira confere se as fontes citadas ainda respondem.
# Se alguma cair, a execução falha e o aviso chega por e-mail.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run conferir:links
