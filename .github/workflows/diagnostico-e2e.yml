name: Diagnóstico e2e (temporário, PR #65)

# TEMPORÁRIO: roda só as falhas do ponta-a-ponta (app-telas, /pt/alumia/salvos do alumia-390 e o laboratório em tela cheia do app-aparelho), no ramo do PR e no master
# (mesmas condições), com rastro e o texto do erro, sem o limite de 40 min do conjunto inteiro apagar o diagnóstico. Sai do
# ramo por commit próprio. Mesma base do ponta-a-ponta.yml: Chrome do runner, banco de teste local, sem segredo, contents:read.
on:
  pull_request:
    paths:
      - ".github/workflows/diagnostico-e2e.yml"

concurrency:
  group: diagnostico-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rotulo: ramo
            ref: ""
          - rotulo: master
            ref: 19e8dd515361813993bff953a428dd3164f04010
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: app-telas, alumia-390 salvos e laboratório em tela cheia
        run: npx playwright test e2e/app-telas e2e/alumia-390 e2e/app-aparelho -g "folha da aula|voltar da barra|alumia/salvos|laboratório aberto fica em tela cheia" --project=computador --trace=retain-on-failure --reporter=list --output=test-results/diag
        env:
          CI: "1"
          ALUMIA_VOTO_SEGREDO: "segredo-so-de-teste-do-e2e-0123456789abcdef"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diagnostico-${{ matrix.rotulo }}
          path: test-results/
          retention-days: 3
