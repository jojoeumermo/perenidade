name: Diagnóstico e2e (temporário, PR #65)

# TEMPORÁRIO: o conjunto inteiro de e2e/ dividido em partes (o ponta-a-ponta.yml estoura os 40 min de uma vez só), no
# computador e no celular. Mesma base do ponta-a-ponta.yml: Chrome do runner, banco de teste local, sem segredo,
# contents:read. Sai do ramo por commit próprio.
on:
  pull_request:
    paths:
      - ".github/workflows/diagnostico-e2e.yml"

concurrency:
  group: diagnostico-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parte: [a, b, c, d]
        alvo: [ramo-computador, master-computador, ramo-celular, master-celular]
        include:
          - alvo: ramo-computador
            projeto: computador
            ref: ""
          - alvo: master-computador
            projeto: computador
            ref: 19e8dd515361813993bff953a428dd3164f04010
          - alvo: ramo-celular
            projeto: celular
            ref: ""
          - alvo: master-celular
            projeto: celular
            ref: 19e8dd515361813993bff953a428dd3164f04010
          - parte: a
            arquivos: "e2e/chat-grupo e2e/escola-acesso e2e/vozes e2e/fluxos"
          - parte: b
            arquivos: "e2e/escola-acompanhante"
          - parte: c
            arquivos: "e2e/escola-agentes"
          - parte: d
            arquivos: "e2e/p4-criacao-coletiva e2e/p4-presenca-print"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: e2e grupo ${{ matrix.parte }}
        run: npx playwright test --project=${{ matrix.projeto }} --grep-invert "fumaça:" ${{ matrix.arquivos }} --retries=0 --timeout=90000 --trace=off --reporter=list --output=test-results/p
        env:
          CI: "1"
          ALUMIA_VOTO_SEGREDO: "segredo-so-de-teste-do-e2e-0123456789abcdef"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: rastros-${{ matrix.alvo }}-${{ matrix.parte }}
          path: test-results/
          retention-days: 3
