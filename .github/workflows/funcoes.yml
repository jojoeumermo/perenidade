name: Publicar funções do Supabase

# Sempre que o código das funções muda no master, publica todas as funções de supabase/functions no Supabase de
# produção (enviar-emails, assistente, avaliar-comunidade, transcrever-audio, transcrever-podcast e youtube). Sem isso, o
# Supabase continua rodando o código antigo. Publicar não liga nada: o assistente segue desligado nos Controles do site.
# Só roda depois de criada a variável FUNCOES com o valor "sim" e do segredo SUPABASE_ACCESS_TOKEN (um token pessoal
# do Supabase: supabase.com › Account › Access Tokens). A variável SUPABASE_PROJECT_REF guarda o código do projeto.
on:
  push:
    branches: [master]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funcoes
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ vars.FUNCOES == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            supabase
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: latest
      - run: supabase functions deploy --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
