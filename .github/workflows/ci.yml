name: Verificação

on:
  pull_request:
    paths-ignore:
      - "content/**"
      - "docs/**"
      - "historico/**"
      - "*.md"
  push:
    branches: [master]
    # Aula, matéria e documentação não mudam o código: a verificação (uns dez minutos de máquina) fica para quando ele muda.
    paths-ignore:
      - "content/**"
      - "docs/**"
      - "historico/**"
      - "*.md"

# Vários envios seguidos: só o último é verificado, os anteriores são cancelados.
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run conferir:i18n
      # Instala o banco do zero em memória e confere cada permissão do painel.
      - run: npm run testar:banco
      # A chamada ao serviço de moderação da comunidade, com o serviço simulado (sem rede e sem chave).
      - run: npm run testar:moderacao
      # A rotina de envio de e-mails, com o banco e o serviço simulados (sem rede e sem chave).
      - run: npm run testar:emails
      # As permissões e os fluxos do podcast (episódios, convidados, revisão, transcrição), no banco em memória.
      - run: npm run testar:podcast
      # Os fluxos críticos (entrar, segundo fator, o que cada função abre no painel, comunidade), pelo mesmo caminho do navegador.
      - run: npm run testar:fumaca
      # O conteúdo das mensagens das conversas (citação, menções, prévia só do endereço, formatação), sem banco.
      - run: npm run testar:mensagens
      # Os arquivos das conversas: tipo pelos bytes, cifra por arquivo presa à conversa, limites (sem banco).
      - run: npm run testar:anexos
      # O motor do Laboratório de Redes (ARP, MAC, rotas, TTL, VLAN) e os oito exercícios.
      - run: npm run testar:redes
      # O aplicador de currículo (disciplinas e trilhas criadas pelo painel), numa cópia temporária dos arquivos.
      - run: npm run testar:curriculo
      # O editor por blocos: toda aula do acervo passa por ele e volta igual.
      - run: npm run testar:blocos
      - run: npm run testar:eletrica
      # O que o site diz aos buscadores: JSON-LD, hreflang sem tradução falsa e robots.txt.
      - run: npm run testar:seo
      # O motor do laboratório de IA: a rede aprende, a semente reproduz, k vizinhos, k-médias, polinômio e bigramas.
      - run: npm run testar:ia
      # O Laboratório de modelos: probabilidade, Schelling, dilema, Gini, SIR, Lotka-Volterra, órbita, Fourier e autômatos.
      - run: npm run testar:modelos
      # As ferramentas novas de prática: ordenação, grafos, sudoku, ABNT, céu, direitos do trabalhador, Karnaugh e contas.
      - run: npm run testar:rodada
      # Chinês (pinyin, CC-CEDICT, busca) e o corretor ortográfico com o dicionário VERO.
      - run: npm run testar:chines
      # O estudo guardado no navegador: repetição espaçada, caderno de erros e a cópia (que não leva chave de aparelho).
      - run: npm run testar:estudo
      # Os exercícios com explicação do erro (content/exercicios): formato, aula existente e cada conta refeita.
      - run: npm run testar:exercicios
      # O que os recursos novos guardam no aparelho (Meu estudo, revisão dos erros, turma, metas) e a leitura das flags.
      - run: npm run testar:meu-estudo
      # O histórico de revisões das aulas (campo "revisoes") e os arquivos de exercícios com o formato certo.
      - run: npm run pendencias
      # O assistente de reforço sem rede: o que se aceita, o pedido a cada provedor, a reserva e a leitura das respostas.
      - run: npm run testar:assistente
      # O aplicador das tarefas aprovadas (ano, sinopse, licença, link), numa cópia temporária de obras.
      - run: npm run testar:tarefas
      # As áreas que a coordenação pode tirar do ar cobrem todas as rotas públicas.
      - run: npm run testar:interdicao
      # A porta de saída para os serviços abertos: só https, só a lista, redirecionamento só dentro da lista.
      - run: npm run testar:externo
      # O build lê e valida todo o conteúdo de content/: arquivo inválido falha aqui.
      - run: npm run build
