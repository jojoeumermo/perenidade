name: Verificação

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run conferir:i18n
      # Instala o banco do zero em memória e confere cada permissão do painel.
      - run: npm run testar:banco
      # A chamada ao serviço de moderação da comunidade, com o serviço simulado (sem rede e sem chave).
      - run: npm run testar:moderacao
      # O build lê e valida todo o conteúdo de content/: arquivo inválido falha aqui.
      - run: npm run build
