name: Verificação

on:
  pull_request:
    paths-ignore:
      - "content/**"
      - "docs/**"
      - "historico/**"
      - "*.md"
  push:
    branches: [master]
    # Aula, matéria e documentação não mudam o código: a verificação (uns dez minutos de máquina) fica para quando ele muda.
    paths-ignore:
      - "content/**"
      - "docs/**"
      - "historico/**"
      - "*.md"

# Vários envios seguidos: só o último é verificado, os anteriores são cancelados.
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Node 24: o motor de cifra do chat (@wireapp/core-crypto) exige WebAssembly JSPI, que só existe no 24 (as flags são
      # ligadas pelo scripts/carregar-ts.mjs). No 22 os testes que carregam o motor nem começam.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run conferir:i18n
      # Instala o banco do zero em memória e confere cada permissão do painel.
      - run: npm run testar:banco
      # A chamada ao serviço de moderação da comunidade, com o serviço simulado (sem rede e sem chave).
      - run: npm run testar:moderacao
      # A rotina de envio de e-mails, com o banco e o serviço simulados (sem rede e sem chave).
      - run: npm run testar:emails
      # As permissões e os fluxos do podcast (episódios, convidados, revisão, transcrição), no banco em memória.
      - run: npm run testar:podcast
      # Os fluxos críticos (entrar, segundo fator, o que cada função abre no painel, comunidade), pelo mesmo caminho do navegador.
      - run: npm run testar:fumaca
      # O conteúdo das mensagens das conversas (citação, menções, prévia só do endereço, formatação), sem banco.
      - run: npm run testar:mensagens
      # Os arquivos das conversas: tipo pelos bytes, cifra por arquivo presa à conversa, limites (sem banco).
      - run: npm run testar:anexos
      # O motor do Laboratório de Redes (ARP, MAC, rotas, TTL, VLAN) e os oito exercícios.
      - run: npm run testar:redes
      # O aplicador de currículo (disciplinas e trilhas criadas pelo painel), numa cópia temporária dos arquivos.
      - run: npm run testar:curriculo
      # O editor por blocos: toda aula do acervo passa por ele e volta igual.
      - run: npm run testar:blocos
      - run: npm run testar:eletrica
      # O que o site diz aos buscadores: JSON-LD, hreflang sem tradução falsa e robots.txt.
      - run: npm run testar:seo
      # O motor do laboratório de IA: a rede aprende, a semente reproduz, k vizinhos, k-médias, polinômio e bigramas.
      - run: npm run testar:ia
      # O Laboratório de modelos: probabilidade, Schelling, dilema, Gini, SIR, Lotka-Volterra, órbita, Fourier e autômatos.
      - run: npm run testar:modelos
      # As ferramentas novas de prática: ordenação, grafos, sudoku, ABNT, céu, direitos do trabalhador, Karnaugh e contas.
      - run: npm run testar:rodada
      # Chinês (pinyin, CC-CEDICT, busca) e o corretor ortográfico com o dicionário VERO.
      - run: npm run testar:chines
      # O estudo guardado no navegador: repetição espaçada, caderno de erros e a cópia (que não leva chave de aparelho).
      - run: npm run testar:estudo
      # Etapa 4, Escola Lúcia Maria (docs/ESCOLA.md): roda todo teste da etapa que já existe e diz quais ainda faltam.
      - run: npm run testar:etapa4
      # Os exercícios com explicação do erro (content/exercicios): formato, aula existente e cada conta refeita.
      - run: npm run testar:exercicios
      # O curso ENEM (docs/ENEM.md): matriz, edição corrente, provas oficiais classificadas, incidência e ligações.
      - run: npm run testar:enem
      # A cobertura contra a Matriz e a fila de revisão (só refazem os relatórios; falham se algum arquivo estiver errado).
      - run: npm run cobertura:enem
      - run: npm run fila:enem
      # O laboratório da TRI (lib/enem-tri.ts): as 528 conferências do estimador e a trava dos parâmetros brutos
      # do item 53958 (Enem 2015), que impedem regenerar o dado com a conversão indevida.
      - run: npm run testar:tri
      - run: npm run testar:tri-parametros
      # O jogo Rumos: os baralhos passam no validador, o motor faz o que promete e todas as cartas e desfechos são alcançáveis.
      - run: npm run testar:jogos
      # O que os recursos novos guardam no aparelho (Meu estudo, revisão dos erros, turma, metas) e a leitura das flags.
      - run: npm run testar:meu-estudo
      # O histórico de revisões das aulas (campo "revisoes") e os arquivos de exercícios com o formato certo.
      - run: npm run pendencias
      # O assistente de reforço sem rede: o que se aceita, o pedido a cada provedor, a reserva e a leitura das respostas.
      - run: npm run testar:assistente
      # O aplicador das tarefas aprovadas (ano, sinopse, licença, link), numa cópia temporária de obras.
      - run: npm run testar:tarefas
      # As áreas que a coordenação pode tirar do ar cobrem todas as rotas públicas.
      - run: npm run testar:interdicao
      # A porta de saída para os serviços abertos: só https, só a lista, redirecionamento só dentro da lista.
      - run: npm run testar:externo
      # O reforço da web (R1): cabeçalhos, porta sem teto, busca segura, imagem e mídia.
      - run: npm run testar:r1-web
      # Os executores de código (IDE, aulas, ferramentas) não alcançam a sessão, o chaveiro das conversas nem outro Worker.
      - run: npm run testar:isolamento
      # A sala das aulas ao vivo: só quem conduz, com a chave registrada e o vídeo assinado, transmite para os alunos.
      - run: npm run testar:aovivo
      # Os depósitos de arquivos: o install.sql cria todas as regras e as que contam envios (podcast, Gaveta) funcionam.
      - run: npm run testar:depositos
      # As caixas anônimas do chat (R2): o banco não liga caixa, passe nem pedido a conta; as rotas recusam a sessão.
      - run: npm run testar:r2-caixas
      - run: npm run testar:r2-caixas-cliente
      # Onda R3 (sem contêiner, sem aparelho): a junção, os rótulos, o resto da R2 (equipe, folhas, urna, enquete, segredos, vetores
      # oficiais), a camada pós-quântica, a mixnet em simulação, o ritmo do tráfego, a casca do Android (manifesto e casca), o modo sem
      # internet e as provas formais guardadas, o app do computador e a transparência dos binários, o chat só nos apps, o servidor do
      # chat (o banco próprio e a interface), o chat entre instâncias e os passes por RSA cego.
      - run: npm run testar:r3-juncao
      - run: npm run testar:r3-rotulos
      - run: npm run testar:r3-resto-equipe
      - run: npm run testar:r3-resto-folhas
      - run: npm run testar:r3-resto-urna
      - run: npm run testar:r3-resto-enquete
      - run: npm run testar:r3-resto-segredos
      - run: npm run testar:r3-resto-saida
      - run: npm run testar:r3-resto-licencas
      - run: npm run testar:r3-resto-preparar
      - run: npm run testar:r3-resto-vetores
      - run: npm run testar:r3-pq
      - run: npm run testar:r3-pq-grupos
      - run: npm run testar:r3-mixnet
      - run: npm run testar:r3-ritmo
      - run: npm run testar:r3-android
      - run: npm run testar:r3-malha
      - run: npm run testar:r3-malha-ativacao
      - run: npm run testar:r3-malha-atos
      - run: npm run testar:r3-malha-banco
      - run: npm run testar:r3-provas
      - run: npm run testar:r3-desktop
      - run: npm run testar:r3-transparencia
      - run: npm run testar:r3-so-app
      - run: npm run testar:r3-servidor
      - run: npm run testar:r3-servidor-interface
      - run: npm run testar:r3-instancias
      - run: npm run testar:r3-auditoria
      - run: npm run testar:r3-passes
      # O build gera mais de vinte mil páginas e enchia o disco da máquina do GitHub ("No space left on device"): antes
      # dele saem as ferramentas pré-instaladas que o projeto não usa (Android, .NET, Haskell, CodeQL), uns 25 GB.
      - name: Espaço em disco para o build
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      # O build lê e valida todo o conteúdo de content/: arquivo inválido falha aqui.
      - run: npm run build
      # O peso do que o navegador baixa nas páginas principais, contra o orçamento combinado (lê a saída do build acima).
      - name: Orçamento de peso
        run: npm run orcamento:peso
      # Quantos arquivos cada função do servidor leva junto: o projeto inteiro em quase toda função fez o envio do deploy
      # passar de 45 min na Vercel (scripts/conferir-rastreio.mjs).
      - name: Rastreio de arquivos das funções
        run: npm run conferir:rastreio
