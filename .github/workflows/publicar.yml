name: Publicar contribuições aprovadas

# De três em três horas, leva para o acervo o que a coordenação aprovou no painel (cada rodada que publica gera uma
# publicação nova na Vercel, e cada publicação esvazia o cache das bordas: de hora em hora, isso estourava a cota).
# Cada rodada vira um registro no histórico: para desfazer uma publicação, basta reverter esse registro.
# A rotina só roda depois de criada a variável PUBLICAR com o valor "sim" (Settings → Secrets and variables →
# Actions → Variables). Antes disso ela é pulada e não consome minutos. Para pausar as publicações, apague a variável.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ vars.PUBLICAR == 'sim' }}
    runs-on: ubuntu-latest
    # A chave de serviço do banco e o token de escrita no repositório só existem nos passos que precisam deles.
    # A instalação dos pacotes (npm ci) e o build rodam código de terceiros e não podem enxergar nenhum dos dois.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # O histórico inteiro: o resumo dele vai para historico/acervo.json (a Vercel só enxerga os últimos registros).
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ferramentas que apagam de um PDF o autor, o programa e o histórico de edição antes de ele entrar no site.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libimage-exiftool-perl qpdf
      - run: npm run sincronizar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # As fichas aprovadas nas tarefas do painel (ano, sinopse, licença, link) entram no acervo junto com o resto.
      - run: node scripts/tarefas.mjs aplicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Há algo novo?
        id: novo
        run: |
          # A pasta dos arquivos aprovados pode ainda não existir: sem ela o "git add" pararia a rotina inteira.
          mkdir -p public/arquivos
          node scripts/historico.mjs
          # lib/areas.ts e os dicionários: as disciplinas criadas, editadas ou removidas em Disciplinas e trilhas.
          git add -A -- content public/arquivos historico lib/areas.ts i18n
          if git diff --cached --quiet; then echo "sim=nao" >> "$GITHUB_OUTPUT"; else echo "sim=sim" >> "$GITHUB_OUTPUT"; fi
      # O build gera mais de vinte mil páginas e enchia o disco da máquina do GitHub ("No space left on device"): antes
      # dele saem as ferramentas pré-instaladas que o projeto não usa (Android, .NET, Haskell, CodeQL), uns 25 GB.
      - if: steps.novo.outputs.sim == 'sim'
        name: Espaço em disco para o build
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      # O build confere cada arquivo novo com as mesmas regras do site: conteúdo inválido não entra.
      - if: steps.novo.outputs.sim == 'sim'
        run: npm run build
      - if: steps.novo.outputs.sim == 'sim'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # O autor precisa ser a conta dona do repositório: a Vercel bloqueia publicações de autores fora da equipe.
          git config user.name "jojoeumermo"
          git config user.email "90794708+jojoeumermo@users.noreply.github.com"
          git commit -m "Publica contribuições aprovadas no painel"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
      # Só depois de o arquivo estar no acervo o painel passa a mostrar o item como publicado.
      - run: npm run sincronizar -- --marcar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Depois do envio: marca as fichas aplicadas, leva ao banco as lacunas do verificador (do site publicado) e confere um
      # lote pequeno de links das obras. Falha aqui não desfaz a publicação.
      - run: node scripts/tarefas.mjs verificar
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
