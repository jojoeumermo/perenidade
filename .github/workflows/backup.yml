name: Cópia do banco

# Toda semana tira uma cópia do banco (dados do instituto, contas e regras dos depósitos), cifra com uma senha que só a
# coordenação tem e guarda aqui no GitHub por 90 dias, como "artefato" da rotina. O plano gratuito do Supabase não
# guarda cópias que se possam restaurar. Restaurar: docs/seguranca/BACKUP.md.
# Artefato de repositório público qualquer conta do GitHub baixa: com o repositório público a rotina não roda, mesmo
# com a cifra (a cópia tem contas e dados pessoais, e uma senha fraca cairia com tempo).
#
# Só roda depois de criados os segredos (Settings → Secrets and variables → Actions → Secrets):
#   BACKUP_DB_URL     a conexão "Session pooler" do Supabase (Connect → Session pooler), com a senha do banco
#   BACKUP_SENHA      uma senha longa, guardada no gerenciador de senhas: sem ela a cópia não abre
on:
  schedule:
    - cron: "15 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  copia:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir os segredos
        id: pronto
        env:
          URL: ${{ secrets.BACKUP_DB_URL }}
          SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          if [ -z "$URL" ] || [ -z "$SENHA" ]; then echo "Faltam BACKUP_DB_URL e BACKUP_SENHA: nada foi copiado."; echo "ok=nao" >> "$GITHUB_OUTPUT"; else echo "ok=sim" >> "$GITHUB_OUTPUT"; fi
      # pg_dump da mesma versão do banco (Postgres 17), pela imagem oficial. Só os esquemas com dados: o resto o
      # install.sql recria. A cópia nunca toca o disco sem cifra: sai do pg_dump direto para o gpg.
      - if: steps.pronto.outputs.ok == 'sim'
        name: Copiar e cifrar
        env:
          URL: ${{ secrets.BACKUP_DB_URL }}
          SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          set -o pipefail
          docker run --rm -e URL postgres:17 sh -c 'pg_dump "$URL" --schema=interno --schema=auth --schema=storage --no-owner --no-privileges --format=custom' \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$SENHA" --symmetric --cipher-algo AES256 -o "lucia-banco-$(date -u +%F).dump.gpg"
          ls -lh lucia-banco-*.dump.gpg
      - if: steps.pronto.outputs.ok == 'sim'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: banco-${{ github.run_id }}
          path: lucia-banco-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
