name: Denunciar conteúdo
description: Avise sobre violação de direitos autorais, erro ou conteúdo impróprio.
title: "Denúncia: "
labels: ["denuncia"]
body:
  - type: markdown
    attributes:
      value: |
        Esta denúncia fica pública. Não inclua dados pessoais.
        Em casos de direitos autorais, o item é tirado do ar enquanto a moderação analisa.
  - type: input
    id: item
    attributes:
      label: Página ou item denunciado
      placeholder: /acervo/nome-da-obra
    validations:
      required: true
  # As opções precisam bater com a lista em components/ReportForm.tsx.
  - type: dropdown
    id: motivo
    attributes:
      label: Motivo
      options:
        - Violação de direitos autorais
        - Informação errada ou enganosa
        - Conteúdo ofensivo ou impróprio
        - Link quebrado ou fonte ilegítima
        - Outro
    validations:
      required: true
  - type: textarea
    id: detalhes
    attributes:
      label: O que está errado
      description: Em caso de direitos autorais, diga qual é a obra e quem é o titular.
    validations:
      required: true
