#
# O servidor do chat separado da Alumia (onda R3, item 3.1; docs/rede/CHAT-SEPARADO.md): caixas anônimas, cofre anônimo e a
# conferência da franquia, com banco Postgres próprio e segredos próprios. Versões exatas (todas com mais de duas semanas em
# 18/11/2026); o Cargo.lock vai junto e o build é com --locked.
[package]
name = "alumia-chat"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.99.0"

[[bin]]
name = "alumia-chat"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1"] }
deadpool-postgres = { version = "=0.14.2" }
ring = "=0.17.14"
serde_json = "=1.0.154"
base64 = "=0.22.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
spki = "=0.8.1"
subtle = "=2.6.1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
