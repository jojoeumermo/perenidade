#
# Regras do Semgrep da Alumia para o Rust (nativo/**: o SPQR em WebAssembly, o núcleo do computador e o servidor do chat; desktop/
# src-tauri/**). O teste está em alumia-rust.rs. O clippy (-D warnings, com
# clippy::undocumented_unsafe_blocks) e o cargo audit rodam à parte (scripts/ferramentas/semgrep.sh só cuida destas).
rules:
  - id: alumia-rust-sorteio-com-semente
    languages: [rust]
    severity: ERROR
    message: >-
      Gerador com semente fixa ou não criptográfico (SmallRng, seed_from_u64, StdRng::from_seed) fora de teste: para chave e nonce,
      só OsRng / getrandom.
    paths:
      include: ["/nativo/**", "/desktop/**", "/.semgrep/*.rs"]
      exclude: ["**/tests/**", "**/benches/**", "**/fuzz/**"]
    pattern-either:
      - pattern: SmallRng::$F(...)
      - pattern: $R::seed_from_u64(...)
      - pattern: StdRng::from_seed(...)

  - id: alumia-rust-sem-log-de-corpo
    languages: [rust]
    severity: ERROR
    message: >-
      O servidor do chat não escreve log do corpo, do endereço nem dos cabeçalhos do pedido (o log liga pedido a pessoa).
    paths:
      include: ["/nativo/servidor-chat/**", "/.semgrep/*.rs"]
    pattern-either:
      - pattern: println!(...)
      - pattern: eprintln!(...)
      - pattern: dbg!(...)
      - pattern: tracing::info!(..., $X = ?$CORPO, ...)
      - pattern: tracing::debug!(...)

  - id: alumia-rust-comparacao-de-segredo
    languages: [rust]
    severity: ERROR
    message: >-
      Token ou marca comparados com == vazam o tempo: use comparação em tempo constante (subtle::ConstantTimeEq, ring::constant_time).
    paths:
      include: ["/nativo/**", "/.semgrep/*.rs"]
    # O filtro pelo nome fica dentro de "patterns" (solto ao lado de "pattern-either" ele era ignorado e a regra pegava todo ==).
    patterns:
      - pattern-either:
          - pattern: $A == $TOKEN.as_bytes()
          - pattern: $TOKEN == $OUTRO
          - pattern: $OUTRO == $TOKEN
          - pattern: $TOKEN != $OUTRO
          - pattern: $OUTRO != $TOKEN
      - metavariable-regex:
          metavariable: $TOKEN
          regex: (?i)^[a-z0-9_.]*(token|segredo|marca|mac|senha)[a-z0-9_]*$

  # O "unsafe só com motivo escrito" não é regra daqui: o Semgrep não enxerga comentário. Quem cobra é o clippy, com
  # -W clippy::undocumented_unsafe_blocks (todo bloco unsafe precisa de um comentário "// SAFETY:" logo acima), no CI.
